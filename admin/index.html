<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>CAD x FORGE — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;color:#000;background:#fff}
header{background:#000;color:#fff;padding:12px 16px 0}header b{letter-spacing:.16em;text-transform:uppercase}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px}nav button{background:none;border:0;color:#aaa;padding:9px 12px;font:inherit;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}nav .on{color:#fff;border-color:#fff}
.note{background:#f4f4f4;border-bottom:1px solid #ddd;padding:10px 16px;font-size:12px;color:#444}
main{max-width:980px;margin:0 auto;padding:16px}h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;background:#000;color:#fff;padding:8px 12px;margin:18px 0 12px}h2:first-child{margin-top:0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.c{border:1px solid #ddd;padding:12px;font-size:12px;color:#555}.c b{display:block;font-size:26px;color:#000}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input,select,textarea,button{font:inherit}input,select,textarea{border:1px solid #bbb;padding:8px;background:#fff;color:#000;border-radius:0;max-width:100%}textarea{width:100%;min-height:70px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#555}.f .w{grid-column:1/-1}.f input,.f select{width:100%}
.b,.s{padding:8px 14px;cursor:pointer;border:1px solid #000}.b{background:#000;color:#fff}.s{background:#fff;color:#000}.s.x{border-color:#a00;color:#a00}
.it{display:flex;gap:12px;align-items:center;border:1px solid #ddd;padding:10px;margin-bottom:8px;flex-wrap:wrap}.it .t{width:54px;height:64px;background:#f4f4f4;object-fit:cover;flex:none}.it .m{flex:1;min-width:170px}.it .m small{color:#777;display:block}.it .a{display:flex;gap:6px;flex-wrap:wrap}.it .a button{padding:5px 9px;font-size:12px}
.tg{font-size:11px;border:1px solid #000;padding:1px 6px;margin-left:6px}.tg.d{border-color:#999;color:#777}
.ch{display:inline-block;border:1px solid #000;padding:3px 9px;margin:0 6px 6px 0;cursor:pointer}.ch.on{background:#000;color:#fff}
.im{display:flex;gap:10px;flex-wrap:wrap}.im>div{width:140px;border:1px dashed #bbb;padding:6px;font-size:12px}.im img{width:100%;height:110px;object-fit:cover;display:block;margin-bottom:6px}.im button{padding:3px 7px;font-size:12px}
.md{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:9;padding:16px}.md>div{background:#fff;max-width:440px;width:100%;max-height:90vh;overflow:auto;padding:16px}.md img{width:100%;max-height:300px;object-fit:contain}
.wr{color:#a00;font-size:12px;margin:6px 0}.mu{color:#777;font-size:12px}details{border:1px solid #ddd;padding:8px 12px;margin-bottom:8px}summary{cursor:pointer}
</style></head><body>
<div id="app"></div><div id="md"></div>
<script src="../catalog.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FMN={pdfa4:"PDF A4",pdfplot:"PDF Plotter",plt:"PLT"},AUDN={w:"Женская",m:"Мужская",k:"Детская",s:"Спец. одежда"},SILS=["dress","top","skirt","trousers","coat","overall"];
let D=CFStore.load(),V="dash",ED=null,NEW=false,FL={q:"",c:"",s:""};
const now=()=>new Date().toISOString(),fd=s=>s?s.slice(0,16).replace("T"," "):"—",cn=id=>(D.categories.find(c=>c.id==id)||{ru:"—"}).ru,nv=v=>v==null||v!==v?"":v;
const uniq=a=>{let x=a,n=2;while(D.products.some(p=>p.a===x))x=a+"-"+n++;return x};
function commit(m){try{if(m)CFStore.log(D,m);CFStore.save(D);return true}catch(e){alert("Не удалось сохранить: "+e.message+"\nВозможно, переполнено хранилище браузера — используйте изображения поменьше.");D=CFStore.load();return false}}
const orders=()=>{try{const o=JSON.parse(localStorage.getItem("buys"));return Array.isArray(o)?o.filter(b=>b&&!b.seed):[]}catch(e){return[]}};
const amt=b=>typeof b.a=="string"?b.a:"★ "+b.a;
function chk(p,pub){if(!p.ru)return"Укажите название на русском";if(!p.a)return"Укажите артикул";if(D.products.some(x=>x.id!=p.id&&x.a===p.a))return"Артикул «"+p.a+"» уже используется";
if(!D.categories.some(c=>c.id==p.cat))return"Выберите категорию";if(!isFinite(p.price)||p.price<0)return"Укажите цену (число не меньше 0)";
if(pub){if(!p.en)return"Для публикации нужно название на английском";if(!p.sizes.length)return"Для публикации выберите размеры";if(!p.formats.length)return"Для публикации выберите хотя бы один формат"}return null}
function pick(cb,acc){const i=document.createElement("input");i.type="file";i.accept=acc||"image/*";i.onchange=()=>{const f=i.files[0];if(f)cb(f)};i.click()}
function pickImg(cb){pick(f=>{if(!/^image\//.test(f.type))return alert("Нужен файл изображения");const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};im.onerror=()=>alert("Не удалось прочитать изображение");im.src=r.result};r.readAsDataURL(f)})}
function setF(f,v){if(/^[he]\d$/.test(f))ED[f[0]][+f[1]]=+v||0;else if(["price","cat","pcs"].includes(f))ED[f]=v===""?NaN:+v;else ED[f]=v}
const A={
tab(v){V=v;ED=null;R()},
new(){const id=Math.max(0,...D.products.map(p=>p.id))+1;ED={id,a:uniq("CF-"+String(id).padStart(3,"0")),ru:"",en:"",dRu:"",dEn:"",cat:D.categories.length?D.categories[0].id:0,aud:"w",sil:"dress",sizes:[],h:[0,0],e:[0,0,0],pcs:0,price:0,cur:D.settings.cur||"★",img:{extra:[]},formats:[],files:{},status:"draft",created:now(),updated:now()};NEW=true;V="form";R()},
edit(v){ED=JSON.parse(JSON.stringify(D.products.find(p=>p.id==v)));ED.img=ED.img||{};ED.img.extra=ED.img.extra||[];NEW=false;V="form";R()},
dup(v){const s=D.products.find(p=>p.id==v),id=Math.max(...D.products.map(p=>p.id))+1,c=JSON.parse(JSON.stringify(s));Object.assign(c,{id,a:uniq(s.a+"-COPY"),ru:s.ru+" (копия)",en:s.en+" (copy)",status:"draft",created:now(),updated:now()});D.products.push(c);if(!commit("Дублирован: "+s.ru))D=CFStore.load();R()},
del(v){const p=D.products.find(x=>x.id==v);if(!confirm("Удалить «"+p.ru+"» без возможности восстановления?"))return;D.products=D.products.filter(x=>x.id!=v);commit("Удалён: "+p.ru);R()},
pub(v){const p=D.products.find(x=>x.id==v),go=p.status!="published";if(go){const e=chk(p,true);if(e)return alert(e)}p.status=go?"published":"draft";p.updated=now();commit((go?"Опубликован: ":"Снят с публикации: ")+p.ru);R()},
prev(v){const p=D.products.find(x=>x.id==v);$("#md").innerHTML=`<div class="md" data-a="mc"><div data-a="nop"><h2>Предпросмотр</h2>${p.img.main?`<img src="${esc(p.img.main)}" alt="">`:'<p class="mu">Нет главного изображения — в магазине будет показан встроенный эскиз.</p>'}<h3>${esc(p.ru)}</h3><p class="mu">${esc(p.en)} · ${esc(p.a)}</p><p>${esc(p.dRu)}</p><p class="mu">${esc(p.dEn)}</p><p><b>${esc(p.price)} ${esc(p.cur)}</b> · ${esc(cn(p.cat))} · ${AUDN[p.aud]}</p><p>Размеры: ${p.sizes.join(", ")||"—"}<br>Рост: ${p.h[0]?p.h[0]+"–"+p.h[1]:"—"}<br>Форматы: ${p.formats.map(f=>FMN[f]).join(", ")||"—"}<br>Статус: ${p.status=="published"?"опубликован":"черновик"}</p><button class="b" data-a="mc">Закрыть</button></div></div>`},
mc(){$("#md").innerHTML=""},
sz(v){const n=+v,s=ED.sizes;ED.sizes=s.includes(n)?s.filter(x=>x!=n):[...s,n].sort((a,b)=>a-b);R()},
fmt(v){ED.formats=ED.formats.includes(v)?ED.formats.filter(x=>x!=v):[...ED.formats,v];R()},
file(v){const ext=v=="plt"?".plt":".pdf";pick(f=>{if(!f.name.toLowerCase().endsWith(ext))return alert("Для этого формата нужен файл "+ext);ED.files[v]={name:f.name,size:f.size};if(!ED.formats.includes(v))ED.formats.push(v);R()},ext)},
filex(v){delete ED.files[v];R()},
img(v){pickImg(s=>{ED.img[v]=s;R()})},imgx(v){delete ED.img[v];R()},
xadd(){pickImg(s=>{ED.img.extra.push(s);R()})},xdel(v){ED.img.extra.splice(+v,1);R()},
save(v){const p=ED;["a","ru","en","dRu","dEn"].forEach(k=>p[k]=String(p[k]||"").trim());const e=chk(p,v=="published");if(e)return alert(e);
p.status=v;p.updated=now();if(NEW)D.products.push(p);else D.products=D.products.map(x=>x.id==p.id?p:x);
if(!commit((NEW?"Создан: ":"Изменён: ")+p.ru+(v=="published"?" (опубликован)":" (черновик)")))return;V="prod";ED=null;R()},
cadd(){const ru=$("#nr").value.trim(),en=$("#ne").value.trim()||ru;if(!ru)return alert("Введите название категории");D.categories.push({id:Math.max(-1,...D.categories.map(c=>c.id))+1,ru,en});commit("Категория добавлена: "+ru);R()},
cdel(v){const c=D.categories.find(x=>x.id==v),n=D.products.filter(p=>p.cat==v).length;if(n)return alert("Нельзя удалить «"+c.ru+"»: к ней привязано товаров — "+n+". Сначала перенесите их в другую категорию.");if(!confirm("Удалить категорию «"+c.ru+"»?"))return;D.categories=D.categories.filter(x=>x.id!=v);commit("Категория удалена: "+c.ru);R()},
szadd(){const n=+$("#ns").value.replace(",",".");if(!(n>0&&n<=300))return alert("Введите положительное число (например, 46)");if(D.sizes.includes(n))return alert("Такой размер уже есть");D.sizes=[...D.sizes,n].sort((a,b)=>a-b);commit("Размер добавлен: "+n);R()},
szdel(v){const n=+v,k=D.products.filter(p=>p.sizes.includes(n)).length;if(k)return alert("Размер "+n+" используется в товарах: "+k+". Сначала уберите его из карточек.");if(!confirm("Удалить размер "+n+" из списка?"))return;D.sizes=D.sizes.filter(x=>x!=n);commit("Размер удалён: "+n);R()},
sset(){if(commit("Изменены настройки магазина"))alert("Настройки сохранены в этом браузере.")},
logo(){pickImg(s=>{D.settings.logo=s;R()})},logox(){D.settings.logo="";R()},
exp(){const b=new Blob([JSON.stringify(D,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="cad-x-forge-catalog-"+now().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},
reset(){if(!confirm("Сбросить каталог к демонстрационным данным? Все текущие товары, категории и настройки будут заменены."))return;D=CFStore.seed();commit("Каталог сброшен к демо-данным");R()}};
function impF(f){if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){return alert("Файл повреждён: это не JSON.")}
const e=CFStore.validate(d);if(e)return alert("Импорт отменён. "+e);
if(!confirm("Заменить ВСЕ текущие данные (товаров: "+D.products.length+") данными из файла (товаров: "+d.products.length+")? Это действие нельзя отменить — сначала сделайте экспорт.\n\nЭкспорт нужен только для переноса вручную: покупатели на других устройствах эти изменения не увидят."))return;
const old=D;D=d;if(!commit("Импортирован каталог из файла")){D=old}R()};r.readAsText(f)}
const lst=()=>{const q=FL.q.trim().toLowerCase(),l=D.products.filter(p=>(!q||(p.ru+p.en+p.a).toLowerCase().includes(q))&&(FL.c===""||p.cat==FL.c)&&(!FL.s||p.status==FL.s)).sort((a,b)=>b.updated.localeCompare(a.updated));
return l.length?l.map(p=>`<div class="it">${p.img.main?`<img class="t" src="${esc(p.img.main)}" alt="">`:'<div class="t"></div>'}<div class="m"><b>${esc(p.ru)}</b><span class="tg ${p.status=="published"?"":"d"}">${p.status=="published"?"опубликован":"черновик"}</span><small>${esc(p.a)} · ${esc(cn(p.cat))} · ${esc(p.price)} ${esc(p.cur)} · размеров: ${p.sizes.length} · изм. ${fd(p.updated)}</small></div><div class="a"><button class="s" data-a="edit" data-v="${p.id}">Изменить</button><button class="s" data-a="prev" data-v="${p.id}">Просмотр</button><button class="s" data-a="dup" data-v="${p.id}">Дублировать</button><button class="s" data-a="pub" data-v="${p.id}">${p.status=="published"?"Снять":"Опубликовать"}</button><button class="s x" data-a="del" data-v="${p.id}">Удалить</button></div></div>`).join(""):'<p class="mu">Ничего не найдено.</p>'};
const inp=(f,l,v,t,w)=>`<label class="${w||""}">${l}<input type="${t||"text"}" data-f="${f}" value="${esc(nv(v))}"${t=="number"?' step="any" min="0"':""}></label>`;
const slot=(k,l)=>`<div>${ED.img[k]?`<img src="${esc(ED.img[k])}" alt="">`:'<p class="mu">нет</p>'}<b>${l}</b><br><button class="s" data-a="img" data-v="${k}">${ED.img[k]?"Заменить":"Выбрать"}</button>${ED.img[k]?` <button class="s x" data-a="imgx" data-v="${k}">✕</button>`:""}</div>`;
const VW={
dash(){const P=D.products,pb=P.filter(p=>p.status=="published").length;return`<h2>Главная</h2><div class="g"><div class="c"><b>${P.length}</b>товаров</div><div class="c"><b>${pb}</b>опубликовано</div><div class="c"><b>${P.length-pb}</b>черновиков</div><div class="c"><b>${orders().length}</b>демо-заказов</div></div><h2>Последние изменения</h2>${D.log.slice(0,8).map(l=>`<div class="it"><span class="mu">${fd(l.t)}</span><span>${esc(l.m)}</span></div>`).join("")||'<p class="mu">Пока нет.</p>'}`},
prod(){return`<h2>Товары</h2><div class="row"><input data-flt="q" placeholder="Поиск: название или артикул" value="${esc(FL.q)}"><select data-flt="c"><option value="">Все категории</option>${D.categories.map(c=>`<option value="${c.id}" ${FL.c!==""&&FL.c==c.id?"selected":""}>${esc(c.ru)}</option>`).join("")}</select><select data-flt="s"><option value="">Любой статус</option><option value="published" ${FL.s=="published"?"selected":""}>Опубликован</option><option value="draft" ${FL.s=="draft"?"selected":""}>Черновик</option></select><button class="b" data-a="new">+ Новый товар</button></div><div id="lst">${lst()}</div>`},
form(){const p=ED;return`<h2>${NEW?"Новый товар":"Редактирование: "+esc(p.ru)}</h2><div class="f">${inp("a","Идентификатор (артикул, уникальный)",p.a)}${inp("ru","Название (RU)",p.ru)}${inp("en","Название (EN)",p.en)}<label>Категория<select data-f="cat">${D.categories.map(c=>`<option value="${c.id}" ${p.cat==c.id?"selected":""}>${esc(c.ru)}</option>`).join("")}</select></label><label>Целевая аудитория<select data-f="aud">${CFStore.AUD.map(a=>`<option value="${a}" ${p.aud==a?"selected":""}>${AUDN[a]}</option>`).join("")}</select></label><label>Встроенный эскиз (если нет изображения)<select data-f="sil">${SILS.map(s=>`<option ${p.sil==s?"selected":""}>${s}</option>`).join("")}</select></label>${inp("price","Цена",p.price,"number")}<label>Валюта<select data-f="cur">${[...new Set(["★","USD","EUR","RUB","KZT",p.cur])].map(c=>`<option ${p.cur==c?"selected":""}>${esc(c)}</option>`).join("")}</select></label>${inp("pcs","Количество деталей",p.pcs,"number")}${inp("h0","Рост от, см",p.h[0],"number")}${inp("h1","Рост до, см",p.h[1],"number")}${inp("e0","Прибавка груди, см",p.e[0],"number")}${inp("e1","Прибавка талии, см",p.e[1],"number")}${inp("e2","Прибавка бёдер, см",p.e[2],"number")}<label class="w">Описание (RU)<textarea data-f="dRu">${esc(p.dRu)}</textarea></label><label class="w">Описание (EN)<textarea data-f="dEn">${esc(p.dEn)}</textarea></label></div>
<h2>Размеры</h2>${D.sizes.map(s=>`<span class="ch ${p.sizes.includes(s)?"on":""}" data-a="sz" data-v="${s}">${s}</span>`).join("")||'<span class="mu">Список пуст</span>'}<p class="mu">Новые значения добавляются в разделе «Категории и размеры».</p>
<h2>Изображения</h2><div class="im">${slot("main","Главный эскиз")}${slot("front","Вид спереди")}${slot("back","Вид сзади")}${p.img.extra.map((s,i)=>`<div><img src="${esc(s)}" alt=""><b>Доп. ${i+1}</b><br><button class="s x" data-a="xdel" data-v="${i}">✕</button></div>`).join("")}<div><p class="mu">+</p><button class="s" data-a="xadd">Добавить</button></div></div><p class="mu">Изображения уменьшаются до 700 px и хранятся в этом браузере.</p>
<h2>Форматы и файлы выкройки</h2>${CFStore.FM.map(k=>`<div class="it"><label><input type="checkbox" data-a="fmt" data-v="${k}" ${p.formats.includes(k)?"checked":""}> <b>${FMN[k]}</b></label><span class="mu m">${p.files[k]?esc(p.files[k].name)+" · "+Math.round(p.files[k].size/1024)+" КБ (только имя)":"файл не выбран"}</span><button class="s" data-a="file" data-v="${k}">${p.files[k]?"Заменить":"Выбрать файл"}</button>${p.files[k]?`<button class="s x" data-a="filex" data-v="${k}">✕</button>`:""}</div>`).join("")}<p class="wr">Демо-режим: сам файл выкройки никуда не загружается и не хранится — записывается только его имя. Постоянное хранение и защищённая выдача покупателям появятся после подключения сервера.</p>
<div class="row" style="margin-top:18px"><button class="b" data-a="save" data-v="published">Опубликовать</button><button class="s" data-a="save" data-v="draft">Сохранить как черновик</button><button class="s" data-a="tab" data-v="prod">Отмена</button></div>`},
cat(){return`<h2>Категории</h2>${D.categories.map(c=>`<div class="row"><input data-cf="ru" data-id="${c.id}" value="${esc(c.ru)}"><input data-cf="en" data-id="${c.id}" value="${esc(c.en)}"><span class="mu">товаров: ${D.products.filter(p=>p.cat==c.id).length}</span><button class="s x" data-a="cdel" data-v="${c.id}">Удалить</button></div>`).join("")}<div class="row"><input id="nr" placeholder="Название (RU)"><input id="ne" placeholder="Название (EN)"><button class="b" data-a="cadd">Добавить категорию</button></div><h2>Размеры</h2><div>${D.sizes.map(s=>`<span class="ch">${s} <span data-a="szdel" data-v="${s}" title="Удалить">✕</span></span>`).join("")}</div><div class="row"><input id="ns" type="number" step="any" placeholder="Например, 46"><button class="b" data-a="szadd">Добавить размер</button></div>`},
