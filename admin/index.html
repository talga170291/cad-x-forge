<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>CAD x FORGE — Admin</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;color:#000;background:#fff}
header{background:#000;color:#fff;padding:12px 16px 0}header b{letter-spacing:.16em;text-transform:uppercase}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px}nav button{background:none;border:0;color:#aaa;padding:9px 12px;font:inherit;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}nav .on{color:#fff;border-color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px}h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;background:#000;color:#fff;padding:8px 12px;margin:18px 0 12px}h2:first-child{margin-top:0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.c{border:1px solid #ddd;padding:12px;font-size:12px;color:#555}.c b{display:block;font-size:24px;color:#000}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input,select,textarea,button{font:inherit}input,select,textarea{border:1px solid #bbb;padding:7px;background:#fff;color:#000;border-radius:0;max-width:100%}textarea{width:100%;min-height:64px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#555}.f .w{grid-column:1/-1}.f input,.f select{width:100%}
.b,.s{padding:8px 14px;cursor:pointer;border:1px solid #000}.b{background:#000;color:#fff}.s{background:#fff;color:#000}.s.x{border-color:#a00;color:#a00}.b:disabled,.s:disabled{opacity:.5}
.it{display:flex;gap:12px;align-items:center;border:1px solid #ddd;padding:10px;margin-bottom:8px;flex-wrap:wrap}.it .t{width:54px;height:64px;background:#f4f4f4;object-fit:cover;flex:none}.it .m{flex:1;min-width:170px}.it small,.mu{color:#777;font-size:12px}.it small{display:block}.it .a{display:flex;gap:6px;flex-wrap:wrap}.it .a button{padding:5px 9px;font-size:12px}
.tg{font-size:11px;border:1px solid #000;padding:1px 6px;margin-left:6px}.tg.d{border-color:#999;color:#777}
.ch{display:inline-block;border:1px solid #000;padding:3px 9px;margin:0 6px 6px 0;cursor:pointer;background:#fff}.ch.on{background:#000;color:#fff}
.im{display:flex;gap:10px;flex-wrap:wrap}.im>div{width:150px;border:1px solid #ddd;padding:6px;font-size:12px}.im img{width:100%;height:120px;object-fit:cover;display:block;margin-bottom:6px;background:#f4f4f4}.im button{padding:3px 7px;font-size:12px;margin:0 2px 2px 0}
.md{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:9;padding:16px}.md>div{background:#fff;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.er{border:1px solid #a00;color:#a00;padding:10px;margin:10px 0}.ok{border:1px solid #000;padding:10px;margin:10px 0}details{border:1px solid #ddd;padding:8px 12px;margin-bottom:8px}summary{cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #eee;padding:4px;text-align:left;vertical-align:middle}td input,td select{width:100%;min-width:60px}#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}#toast.on{opacity:1}</style></head><body><div id="app"></div><div id="toast"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../config.js"></script>
<script src="../api.js"></script>
<script>
const $=s=>document.querySelector(s),TG=window.Telegram&&Telegram.WebApp,API=window.cfxApi,U=window.cfxUrl;
const esc=x=>String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ERR={network:'Нет связи с сервером',unauthorized:'Нет авторизации Telegram',invalid_init_data:'Подпись Telegram неверна — откройте админку из бота (/admin)',init_data_expired:'Сессия устарела — откройте админку из бота заново',forbidden:'Нет доступа: ваш Telegram ID не в списке администраторов',validation:'Проверьте поля формы',duplicate:'Такое значение уже существует (артикул, slug или код)',in_use:'Нельзя удалить: запись используется (сначала архивируйте или отвяжите товары)',invalid_reference:'Указана несуществующая связанная запись',file_too_large:'Файл слишком большой',invalid_file_type:'Недопустимый тип или содержимое файла',invalid_format:'Неизвестный формат файла',not_found:'Не найдено',not_ready:'Товар не готов к публикации',not_refundable:'Заказ нельзя вернуть',telegram_error:'Telegram отклонил запрос',server_error:'Ошибка сервера'};
const em=e=>{let m=ERR[e&&e.code]||'Ошибка: '+(e&&e.code||'unknown');if(e&&e.code==='not_ready'&&e.details&&e.details.missing)m+=': не хватает — '+e.details.missing.map(x=>({image:'изображения',file:'файла выкройки',price:'цены ≥ 1 ★',category:'категории',name_ru:'названия'}[x]||x)).join(', ');if(e&&e.code==='validation'&&e.details&&e.details.field)m+=' (поле '+e.details.field+')';if(e&&e.code==='invalid_file_type'&&e.details&&e.details.expected)m+=' (нужен .'+e.details.expected+')';return m};
let tm;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>e.classList.remove('on'),3500)}
const fd=s=>s?new Date(s*1000).toISOString().slice(0,16).replace('T',' '):'—',fs=n=>n>1048576?(n/1048576).toFixed(1)+' МБ':Math.max(1,Math.round(n/1024))+' КБ';
const ST={draft:'черновик',ready:'готов',published:'опубликован',hidden:'скрыт',archived:'архив'};
const DICT_CFG={
 categories:{t:'Категории',c:[['slug','slug'],['name_ru','RU'],['name_kk','KK'],['name_en','EN'],['parent_id','Родитель','sel:categories'],['sort','Порядок','num'],['hidden','Скрыть','chk'],['archived','Архив','chk']],img:1},
 audiences:{t:'Аудитория (пол)',c:[['slug','slug'],['name_ru','RU'],['name_kk','KK'],['name_en','EN'],['sort','Порядок','num'],['hidden','Скрыть','chk']]},
 size_groups:{t:'Размерные группы',c:[['slug','slug'],['name_ru','RU'],['name_kk','KK'],['name_en','EN'],['sort','Порядок','num']]},
 sizes:{t:'Размеры',c:[['group_id','Группа','sel:size_groups'],['label','Значение'],['sort','Порядок','num'],['hidden','Скрыть','chk']]},
 height_groups:{t:'Ростовые группы',c:[['slug','slug'],['name_ru','RU'],['name_kk','KK'],['name_en','EN'],['sort','Порядок','num']]},
 heights:{t:'Ростовки',c:[['group_id','Группа','sel:height_groups'],['label','Значение'],['cm','см','num'],['sort','Порядок','num'],['hidden','Скрыть','chk']]},
 tags:{t:'Теги',c:[['slug','slug'],['name_ru','RU'],['name_kk','KK'],['name_en','EN'],['sort','Порядок','num'],['hidden','Скрыть','chk']]},
 attributes:{t:'Характеристики',c:[['slug','slug'],['kind','Тип','sel:kind'],['filterable','Фильтр','chk'],['name_ru','RU'],['name_kk','KK'],['name_en','EN'],['sort','Порядок','num']]},
 attribute_values:{t:'Значения характеристик',c:[['attribute_id','Характеристика','sel:attributes'],['value_ru','RU'],['value_kk','KK'],['value_en','EN'],['sort','Порядок','num']]},
 file_formats:{t:'Форматы файлов',c:[['code','Код'],['label','Название'],['ext','Расширение'],['sort','Порядок','num'],['active','Активен','chk']],pk:'code'}};
const S={tab:'dash',auth:null,err:null,D:{},ed:null,pl:{items:[],total:0,page:1},pf:{q:'',status:'',category:''},dict:'categories',ol:null,cu:null,au:null,st:null,set:null,of:{status:'',q:''},cq:''};
async function dicts(){const n=Object.keys(DICT_CFG);const r=await Promise.all(n.map(k=>API('/api/admin/dict/'+k)));n.forEach((k,i)=>S.D[k]=r[i].items)}
const lab=(l,id,f)=>{const x=(S.D[l]||[]).find(y=>y.id==id);return x?(x[f||'name_ru']||x.label||x.slug):''};
async function init(){R();
 if(!(TG&&TG.initData)){S.err={code:'unauthorized'};R();return}
 try{TG.ready();TG.expand()}catch(e){}
 try{const me=await API('/api/me');if(!me.is_admin){S.err={code:'forbidden'};R();return}S.auth=me.user;await dicts();await go('dash')}catch(e){S.err=e;R()}}
async function go(tab){S.tab=tab;S.ed=null;R();try{
 if(tab==='dash'){S.st=await API('/api/admin/stats')}else if(tab==='prod')await loadPL(1);else if(tab==='ord')await loadOL();else if(tab==='cus')await loadCU();else if(tab==='set'){S.set=await API('/api/admin/settings')}else if(tab==='audit'){S.au=(await API('/api/admin/audit')).items}else if(tab==='tax')await dicts();}catch(e){toast(em(e))}R()}
async function loadPL(p){const q=new URLSearchParams({page:p,limit:30});for(const k in S.pf)if(S.pf[k])q.set(k,S.pf[k]);S.pl=await API('/api/admin/products?'+q)}
async function loadOL(){const q=new URLSearchParams({limit:30});for(const k in S.of)if(S.of[k])q.set(k,S.of[k]);S.ol=await API('/api/admin/orders?'+q)}
async function loadCU(){S.cu=await API('/api/admin/customers?limit=50'+(S.cq?'&q='+encodeURIComponent(S.cq):''))}
const opts=(l,sel,f,empty)=>(empty?'<option value="">—</option>':'')+(S.D[l]||[]).map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(x[f||'name_ru']||x.label)}</option>`).join('');
// ---------- представления ----------
const V={
dash(){const s=S.st;if(!s)return'<h2>Главная</h2><p class="mu">Загрузка…</p>';const pr=s.products,or=s.orders,n=o=>o||0;
 return `<h2>Главная</h2><div class="g"><div class="c"><b>${n(pr.draft)+n(pr.ready)+n(pr.published)+n(pr.hidden)+n(pr.archived)}</b>товаров</div><div class="c"><b>${n(pr.published)}</b>опубликовано</div><div class="c"><b>${n(pr.draft)+n(pr.ready)}</b>черновики и готовые</div><div class="c"><b>${n(or.paid)}</b>оплаченных заказов</div><div class="c"><b>★ ${s.sales_stars}</b>продажи</div><div class="c"><b>${s.users}</b>пользователей</div></div>
 <h2>Последние заказы</h2>${s.recent_orders.map(o=>`<div class="it"><b>${esc(o.number)}</b><span>${esc(o.status)}</span><span>★ ${o.total_stars}</span><span class="mu">${esc(o.username?'@'+o.username:o.first_name||'')} · ${fd(o.created_at)}</span></div>`).join('')||'<p class="mu">Заказов пока нет.</p>'}
 <h2>Продажи за 14 дней</h2>${s.daily.map(d=>`<div class="it"><b>${esc(d.day)}</b><span>${d.orders} зак.</span><span>★ ${d.stars}</span></div>`).join('')||'<p class="mu">Нет оплат.</p>'}`},
prod(){const p=S.pl;return `<h2>Товары</h2><div class="row"><input data-pf="q" placeholder="Поиск: название, артикул" value="${esc(S.pf.q)}"><select data-pf="status"><option value="">Любой статус</option>${Object.keys(ST).map(k=>`<option value="${k}" ${S.pf.status===k?'selected':''}>${ST[k]}</option>`).join('')}</select><select data-pf="category">${opts('categories',S.pf.category,'name_ru',true)}</select><button class="b" data-a="new">+ Добавить товар</button></div>
 ${p.items.map(x=>`<div class="it">${x.image?`<img class="t" src="${esc(U(x.image))}" alt="">`:'<div class="t"></div>'}<div class="m"><b>${esc(x.name_ru)}</b><span class="tg ${x.status==='published'?'':'d'}">${ST[x.status]}</span><small>${esc(x.sku)} · ${esc(lab('categories',x.category_id))} · ★ ${x.price_stars} · ${x.formats.join(', ')||'нет файлов'} · изм. ${fd(x.updated_at)}</small></div><div class="a"><button class="s" data-a="edit" data-v="${x.id}">Изменить</button>${x.status==='published'?`<button class="s" data-a="st" data-v="${x.id}" data-k="hidden">Снять с публикации</button>`:`<button class="s" data-a="st" data-v="${x.id}" data-k="published">Опубликовать</button>`}${x.status!=='archived'?`<button class="s" data-a="st" data-v="${x.id}" data-k="archived">В архив</button>`:''}<button class="s x" data-a="del" data-v="${x.id}">Удалить</button></div></div>`).join('')||'<p class="mu">Ничего не найдено.</p>'}
 <div class="row"><span class="mu">Всего: ${p.total}</span>${p.page>1?'<button class="s" data-a="pg" data-v="-1">‹ Назад</button>':''}${p.page*30<p.total?'<button class="s" data-a="pg" data-v="1">Далее ›</button>':''}</div>`},
form(){const p=S.ed,id=p.id,D=S.D,nw=!id,inp=(k,l,t,w)=>`<label class="${w||''}">${l}<input type="${t||'text'}" data-f="${k}" value="${esc(p[k]==null?'':p[k])}"${t==='number'?' min="0"':''}></label>`;
 const grp=(sl,gl,sel,key)=>(D[gl]||[]).map(g=>{const it=(D[sl]||[]).filter(x=>x.group_id===g.id&&!x.hidden);return it.length?`<div class="mu">${esc(g.name_ru)}</div><div>${it.map(x=>`<span class="ch ${sel.includes(x.id)?'on':''}" data-a="tgl" data-k="${key}" data-v="${x.id}">${esc(x.label)}</span>`).join('')}</div>`:''}).join('');
 const attr=(D.attributes||[]).map(a=>{const cur=(p.attributes||[]).find(x=>x.attribute_id===a.id)||{};return a.kind==='text'?`<label>${esc(a.name_ru)}<input data-at="${a.id}" data-t="text" value="${esc(cur.text_value||'')}"></label>`:`<label>${esc(a.name_ru)}<select data-at="${a.id}" data-t="choice"><option value="">—</option>${(D.attribute_values||[]).filter(v=>v.attribute_id===a.id).map(v=>`<option value="${v.id}" ${cur.value_id===v.id?'selected':''}>${esc(v.value_ru)}</option>`).join('')}</select></label>`}).join('');
 const imgs=(p.images||[]).map((i,ix)=>`<div><img src="${esc(U(i.url))}" alt=""><b>${i.kind==='main'?'Главное':i.kind==='preview'?'Превью':'Доп.'}</b><br>${i.kind!=='main'?`<button class="s" data-a="imain" data-v="${i.id}">Сделать главным</button>`:''}${ix>0?`<button class="s" data-a="imv" data-v="${i.id}" data-k="-1">←</button>`:''}${ix<p.images.length-1?`<button class="s" data-a="imv" data-v="${i.id}" data-k="1">→</button>`:''}<button class="s x" data-a="idel" data-v="${i.id}">Удалить</button></div>`).join('');
 const files=(D.file_formats||[]).filter(f=>f.active).map(f=>{const all=(p.files||[]).filter(x=>x.format===f.code),act=all.find(x=>x.active);return `<div class="it"><b style="min-width:100px">${esc(f.label)}</b><div class="m">${act?`${esc(act.filename)} · ${fs(act.size)} · v${act.version} · <span class="mu">sha256 ${act.checksum.slice(0,10)}… · ${fd(act.created_at)} · активен</span>`:'<span class="mu">файл не загружен</span>'}${all.filter(x=>!x.active).length?`<small>Предыдущих версий: ${all.filter(x=>!x.active).length} (хранятся, покупатели не теряют доступ)</small>`:''}</div><div class="a"><button class="s" data-a="fup" data-v="${f.code}" data-k="${f.ext}">${act?'Заменить (новая версия)':'Загрузить'}</button>${act?`<button class="s x" data-a="fdel" data-v="${act.id}">Отключить</button>`:''}</div></div>`}).join('');
 return `<h2>${nw?'Новый товар':'Товар: '+esc(p.name_ru)} ${id?`<span class="tg" style="color:#fff;border-color:#fff">${ST[p.status]}</span>`:''}</h2><div class="f">${inp('sku','Артикул (уникальный)')}${inp('name_ru','Название RU')}${inp('name_kk','Название KK')}${inp('name_en','Название EN')}
 <label>Категория<select data-f="category_id">${opts('categories',p.category_id,'name_ru',true)}</select></label><label>Аудитория / пол<select data-f="audience_id">${opts('audiences',p.audience_id,'name_ru',true)}</select></label>${inp('price_stars','Цена, Telegram Stars (целое ≥ 1 для продажи)','number')}${inp('pieces_count','Количество деталей','number')}${inp('sort','Порядок сортировки','number')}<label>Избранный<select data-f="featured"><option value="0" ${p.featured?'':'selected'}>Нет</option><option value="1" ${p.featured?'selected':''}>Да</option></select></label>
 <label class="w">Описание RU<textarea data-f="desc_ru">${esc(p.desc_ru)}</textarea></label><label class="w">Описание KK<textarea data-f="desc_kk">${esc(p.desc_kk)}</textarea></label><label class="w">Описание EN<textarea data-f="desc_en">${esc(p.desc_en)}</textarea></label></div>
 <h2>Размеры</h2>${grp('sizes','size_groups',p.size_ids,'size_ids')||'<p class="mu">Нет размеров — добавьте во вкладке «Справочники».</p>'}<h2>Ростовки</h2>${grp('heights','height_groups',p.height_ids,'height_ids')||'<p class="mu">Нет ростовок.</p>'}
 <h2>Теги</h2><div>${(D.tags||[]).filter(x=>!x.hidden).map(x=>`<span class="ch ${p.tag_ids.includes(x.id)?'on':''}" data-a="tgl" data-k="tag_ids" data-v="${x.id}">${esc(x.name_ru)}</span>`).join('')}</div><h2>Характеристики</h2><div class="f">${attr}</div>
 <div class="row" style="margin-top:14px"><button class="b" data-a="save">${nw?'Создать черновик':'Сохранить изменения'}</button><button class="s" data-a="tab" data-v="prod">Закрыть</button></div>
 ${nw?'<p class="mu">Изображения и файлы можно загрузить после первого сохранения.</p>':`<h2>Изображения</h2><div class="im">${imgs||'<span class="mu">Нет изображений</span>'}</div><div class="row" style="margin-top:8px"><button class="s" data-a="iup" data-v="main">Загрузить главное</button><button class="s" data-a="iup" data-v="extra">Добавить изображение</button><button class="s" data-a="iup" data-v="preview">Добавить превью лекал</button></div>
 <h2>Файлы выкройки (только для покупателей)</h2>${files}<p class="mu">Файлы хранятся в закрытом хранилище R2 и выдаются только после оплаты. Допустимые форматы задаются во вкладке «Справочники → Форматы файлов».</p>
 <h2>Статус</h2><div class="row">${Object.keys(ST).map(k=>`<button class="${p.status===k?'b':'s'}" data-a="pst" data-v="${k}">${ST[k]}</button>`).join('')}</div><p class="mu">В магазине виден только статус «опубликован». Для публикации нужны: название, цена ≥ 1, категория, изображение и файл выкройки.</p>`}`},
tax(){const k=S.dict,c=DICT_CFG[k],pk=c.pk||'id',rows=S.D[k]||[];
 const cell=(col,r,id)=>{const [f,,t]=col,v=r[f];if(t==='chk')return `<input type="checkbox" data-d="${f}" ${v?'checked':''}>`;if(t&&t.startsWith('sel:')){const l=t.slice(4);const o=l==='kind'?'<option value="text">text</option><option value="choice">choice</option>'.replace(`"${v}"`,`"${v}" selected`):opts(l,v,l==='size_groups'||l==='height_groups'||l==='categories'||l==='attributes'?'name_ru':'label',f==='parent_id');return `<select data-d="${f}">${o}</select>`}return `<input data-d="${f}" type="${t==='num'?'number':'text'}" value="${esc(v==null?'':v)}">`};
 return `<h2>Справочники</h2><div class="row">${Object.keys(DICT_CFG).map(x=>`<span class="ch ${x===k?'on':''}" data-a="dict" data-v="${x}">${DICT_CFG[x].t}</span>`).join('')}</div><div style="overflow-x:auto"><table><tr>${c.c.map(x=>`<th>${x[1]}</th>`).join('')}<th></th></tr>
 ${rows.map(r=>`<tr data-row="${r[pk]}">${c.c.map(col=>`<td>${cell(col,r)}</td>`).join('')}<td style="white-space:nowrap"><button class="s" data-a="dsave" data-v="${r[pk]}">Сохранить</button> ${c.img?`<button class="s" data-a="dimg" data-v="${r[pk]}">Фото</button> `:''}<button class="s x" data-a="ddel" data-v="${r[pk]}">Удалить</button></td></tr>`).join('')}
 <tr data-row="new">${c.c.map(col=>`<td>${cell(col,col[2]==='chk'?{}:col[2]==='num'?{}:{})}</td>`).join('')}<td><button class="b" data-a="dsave" data-v="new">+ Добавить</button></td></tr></table></div><p class="mu">Удалить можно только неиспользуемую запись. Категории лучше скрывать или архивировать.</p>`},
ord(){const o=S.ol;return `<h2>Заказы</h2><div class="row"><input data-of="q" placeholder="Номер, @username, имя, Telegram ID" value="${esc(S.of.q)}"><select data-of="status"><option value="">Любой статус</option>${['pending','paid','failed','refunded','cancelled'].map(x=>`<option ${S.of.status===x?'selected':''}>${x}</option>`).join('')}</select></div>
 ${o?o.items.map(x=>`<div class="it"><b>${esc(x.number)}</b><span class="tg">${esc(x.status)}</span><div class="m">${x.items.map(i=>esc(i.title)).join(', ')}<small>${esc(x.username?'@'+x.username:x.first_name||'')} · ID ${x.user_id} · ${fd(x.created_at)}${x.paid_at?' · оплачен '+fd(x.paid_at):''}</small></div><b>★ ${x.total_stars}</b><div class="a"><button class="s" data-a="odet" data-v="${x.id}">Подробнее</button>${x.status==='paid'?`<button class="s x" data-a="ref" data-v="${x.id}">Вернуть Stars</button>`:''}</div></div>`).join('')||'<p class="mu">Заказов нет.</p>':'<p class="mu">Загрузка…</p>'}`},
cus(){const c=S.cu;return `<h2>Покупатели</h2><div class="row"><input data-cq placeholder="@username, имя, ID" value="${esc(S.cq)}"></div>${c?c.items.map(x=>`<div class="it"><b>${esc(x.first_name||'')} ${esc(x.last_name||'')}</b><span class="mu">${x.username?'@'+esc(x.username):''} · ID ${x.id} · ${esc(x.lang||'')}</span><span>покупок: ${x.purchases}</span><span>★ ${x.spent_stars}</span><small>с ${fd(x.created_at)} · был ${fd(x.last_seen_at)}</small></div>`).join('')||'<p class="mu">Нет.</p>':'<p class="mu">Загрузка…</p>'}`},
set(){const s=S.set;if(!s)return'<h2>Настройки</h2><p class="mu">Загрузка…</p>';const L=['ru','kk','en'],tx=(k,l)=>`<label class="w">${l}<input data-st="${k}" value="${esc(s[k]||'')}"></label>`;
 return `<h2>Настройки магазина</h2><div class="f">${tx('store_name','Название магазина')}${tx('store_description','Описание')}${tx('support_username','Контакт поддержки (@username)')}${tx('bot_username','Username бота')}${tx('currency_label','Символ валюты')}
 <label>Язык по умолчанию<select data-st="default_lang">${L.map(l=>`<option ${s.default_lang===l?'selected':''}>${l}</option>`).join('')}</select></label><label>Товаров на странице (6–50)<input type="number" data-st="page_size" value="${s.page_size||20}"></label>
 <label class="w">Доступные языки<span>${L.map(l=>`<label style="display:inline"><input type="checkbox" data-lg="${l}" ${(s.languages||[]).includes(l)?'checked':''}> ${l}</label> `).join('')}</span></label>
 <label class="w"><span><input type="checkbox" data-st="maintenance" ${s.maintenance?'checked':''}> Режим обслуживания (магазин закрыт для покупателей)</span></label>
 ${L.map(l=>`<label class="w">Приветствие бота (${l}) — пусто = стандартный текст<textarea data-ms="msg_welcome:${l}">${esc((s.msg_welcome||{})[l]||'')}</textarea></label><label class="w">Сообщение об оплате (${l})<textarea data-ms="msg_paid:${l}">${esc((s.msg_paid||{})[l]||'')}</textarea></label>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="b" data-a="setsave">Сохранить настройки</button><button class="s" data-a="logo">Загрузить логотип</button></div>
 <h2>Подключение бота</h2><p class="mu">Устанавливает webhook, команды и кнопку меню бота. Нужно один раз после развёртывания.</p><button class="s" data-a="tgsetup">Подключить бота</button>`},
audit(){return `<h2>Журнал действий администратора</h2>${(S.au||[]).map(a=>`<div class="it"><span class="mu">${fd(a.created_at)}</span><b>${esc(a.action)}</b><span>${esc(a.object_type||'')} ${esc(a.object_id||'')}</span><span class="mu">admin ${a.admin_id}</span><small>${esc(a.details||'')}</small></div>`).join('')||'<p class="mu">Пусто.</p>'}`}};
function R(){const T=[['dash','Главная'],['prod','Товары'],['tax','Справочники'],['ord','Заказы'],['cus','Покупатели'],['set','Настройки'],['audit','Журнал']];
 $('#app').innerHTML=`<header><b>CAD × FORGE · Admin</b><nav>${T.map(t=>`<button class="${S.tab===t[0]||(S.ed&&t[0]==='prod')?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</nav></header><main>${S.err?`<div class="er">${esc(em(S.err))}${S.err.code==='unauthorized'?'<br>Админка работает только внутри Telegram: откройте бота и отправьте команду /admin.':''}</div>`:S.ed?V.form():V[S.tab]()}</main>`}
// ---------- действия ----------
const blank=()=>({sku:'',name_ru:'',name_kk:'',name_en:'',desc_ru:'',desc_kk:'',desc_en:'',category_id:null,audience_id:null,price_stars:0,pieces_count:0,sort:0,featured:0,size_ids:[],height_ids:[],tag_ids:[],attributes:[],images:[],files:[],status:'draft'});
const norm=p=>{p.size_ids=(p.sizes||[]).map(x=>x.id);p.height_ids=(p.heights||[]).map(x=>x.id);p.tag_ids=(p.tags||[]).map(x=>x.id);return p};
const payload=()=>{const p=S.ed,o={};['sku','name_ru','name_kk','name_en','desc_ru','desc_kk','desc_en'].forEach(k=>o[k]=p[k]||'');o.category_id=p.category_id||null;o.audience_id=p.audience_id||null;o.price_stars=Number(p.price_stars)||0;o.pieces_count=Number(p.pieces_count)||0;o.sort=Number(p.sort)||0;o.featured=p.featured?1:0;o.size_ids=p.size_ids;o.height_ids=p.height_ids;o.tag_ids=p.tag_ids;o.attributes=p.attributes||[];return o};
async function reload(id){S.ed=norm(await API('/api/admin/products/'+id,{}));R()}
function pickFile(accept,cb){const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>{if(i.files[0])cb(i.files[0])};i.click()}
function shrink(f,max){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no({code:'invalid_file_type'}),'image/jpeg',.85)};im.onerror=()=>no({code:'invalid_file_type'});im.src=r.result};r.readAsDataURL(f)})}
const up=(path,blob,h)=>API(path,{method:'POST',body:blob,headers:h||{}});
async function act(a,el){const d=el.dataset,v=d.v;try{switch(a){
case'tab':await go(v);return;
case'new':S.ed=blank();R();return;
case'edit':await reload(v);return;
case'pg':await loadPL(S.pl.page+Number(v));break;
case'st':await API(`/api/admin/products/${v}/status`,{method:'POST',body:{status:d.k}});toast('Статус изменён: '+ST[d.k]);await loadPL(S.pl.page);break;
case'del':if(!confirm('Удалить товар? Если он ещё не продавался — будет удалён полностью вместе с файлами, иначе перемещён в архив.'))return;{const r=await API(`/api/admin/products/${v}?hard=1`,{method:'DELETE'});toast(r.deleted?'Товар удалён':'Товар уже продавался — перемещён в архив')}await loadPL(S.pl.page);break;
case'tgl':{const l=S.ed[d.k],n=Number(v);S.ed[d.k]=l.includes(n)?l.filter(x=>x!==n):[...l,n];break}
case'save':{const r=S.ed.id?await API('/api/admin/products/'+S.ed.id,{method:'PUT',body:payload()}):await API('/api/admin/products',{method:'POST',body:payload()});S.ed=norm(r);toast('Сохранено');break}
case'pst':{if(!S.ed.id)return;await API(`/api/admin/products/${S.ed.id}/status`,{method:'POST',body:{status:v}});toast('Статус: '+ST[v]);await reload(S.ed.id);return}
case'iup':pickFile('image/*',async f=>{try{const b=await shrink(f,1600);await up(`/api/admin/upload/image?kind=${v}&product_id=${S.ed.id}`,b);toast('Изображение загружено');await reload(S.ed.id)}catch(e){toast(em(e))}});return;
case'idel':if(!confirm('Удалить изображение?'))return;await API('/api/admin/images/'+v,{method:'DELETE'});await reload(S.ed.id);return;
case'imain':await API(`/api/admin/images/${v}/main`,{method:'POST'});await reload(S.ed.id);return;
case'imv':{const ids=S.ed.images.map(i=>i.id),i=ids.indexOf(Number(v)),j=i+Number(d.k);if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];await API(`/api/admin/products/${S.ed.id}/images/order`,{method:'POST',body:{ids}});await reload(S.ed.id);return}
case'fup':pickFile('.'+d.k,async f=>{try{toast('Загрузка файла…');await up(`/api/admin/upload/file?product_id=${S.ed.id}&format=${v}&filename=${encodeURIComponent(f.name)}`,f);toast('Файл загружен');await reload(S.ed.id)}catch(e){toast(em(e))}});return;
case'fdel':if(!confirm('Отключить файл? Покупатели его больше не получат, пока вы не загрузите новый.'))return;await API('/api/admin/files/'+v,{method:'DELETE'});await reload(S.ed.id);return;
case'dict':S.dict=v;break;
case'dsave':{const k=S.dict,c=DICT_CFG[k],tr=el.closest('tr'),o={};c.c.forEach(([f,,t])=>{const e=tr.querySelector(`[data-d="${f}"]`);o[f]=t==='chk'?(e.checked?1:0):t==='num'||(t&&t.startsWith('sel:')&&t!=='sel:kind')?(e.value===''?null:Number(e.value)):e.value});
 if(v==='new')await API('/api/admin/dict/'+k,{method:'POST',body:o});else await API(`/api/admin/dict/${k}/${v}`,{method:'PUT',body:o});toast('Сохранено');await dicts();break}
case'ddel':if(!confirm('Удалить запись?'))return;await API(`/api/admin/dict/${S.dict}/${v}`,{method:'DELETE'});toast('Удалено');await dicts();break;
case'dimg':pickFile('image/*',async f=>{try{await up(`/api/admin/upload/image?kind=category&category_id=${v}`,await shrink(f,800));toast('Фото категории загружено')}catch(e){toast(em(e))}});return;
case'odet':{const o=await API('/api/admin/orders/'+v);alert([`Заказ ${o.number} — ${o.status}`,`Покупатель: ${o.first_name||''} ${o.username?'@'+o.username:''} (ID ${o.user_id})`,'',...o.items.map(i=>`• ${i.title} (${i.sku}) ★ ${i.price_stars}${i.size?' · размер '+i.size:''}${i.height?' · рост '+i.height:''}`),'',...o.payments.map(p=>`Платёж ${p.status}: ${p.amount} ${p.currency}, ${p.telegram_charge_id}`)].join('\n'));return}
case'ref':if(!confirm('Вернуть Stars покупателю? Доступ к файлам по этому заказу будет отозван.'))return;await API(`/api/admin/orders/${v}/refund`,{method:'POST'});toast('Возврат выполнен');await loadOL();break;
case'setsave':{const o={};document.querySelectorAll('[data-st]').forEach(e=>{const k=e.dataset.st;o[k]=e.type==='checkbox'?e.checked:k==='page_size'?Number(e.value):e.value});o.languages=[...document.querySelectorAll('[data-lg]')].filter(e=>e.checked).map(e=>e.dataset.lg);
 ['msg_welcome','msg_paid'].forEach(k=>{o[k]={};document.querySelectorAll(`[data-ms^="${k}:"]`).forEach(e=>{if(e.value.trim())o[k][e.dataset.ms.split(':')[1]]=e.value.trim()})});
 if(!o.languages.length){toast('Выберите хотя бы один язык');return}S.set=await API('/api/admin/settings',{method:'PUT',body:o});toast('Настройки сохранены');break}
case'logo':pickFile('image/*',async f=>{try{await up('/api/admin/upload/image?kind=logo',await shrink(f,600));toast('Логотип загружен');S.set=await API('/api/admin/settings')}catch(e){toast(em(e))}});return;
case'tgsetup':await API('/api/admin/telegram/setup',{method:'POST'});toast('Бот подключён: webhook, команды и меню настроены');return}}
catch(e){toast(em(e));if(e&&['unauthorized','invalid_init_data','init_data_expired'].includes(e.code)){S.err=e}}R()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b)});
let t1;document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.f&&S.ed){S.ed[t.dataset.f]=t.type==='number'?t.value:(['category_id','audience_id'].includes(t.dataset.f)?(t.value?Number(t.value):null):t.dataset.f==='featured'?Number(t.value):t.value)}
 else if(t.dataset.at&&S.ed){const id=Number(t.dataset.at);S.ed.attributes=(S.ed.attributes||[]).filter(x=>x.attribute_id!==id);if(t.value)S.ed.attributes.push(t.dataset.t==='text'?{attribute_id:id,text_value:t.value}:{attribute_id:id,value_id:Number(t.value)})}
 else if(t.dataset.pf!==undefined){S.pf[t.dataset.pf]=t.value;clearTimeout(t1);t1=setTimeout(async()=>{try{await loadPL(1);const q=document.activeElement;const k=q&&q.dataset.pf,s=q&&q.selectionStart;R();if(k){const n=document.querySelector(`[data-pf="${k}"]`);if(n){n.focus();try{n.setSelectionRange(s,s)}catch(e){}}}}catch(e){toast(em(e))}},300)}
 else if(t.dataset.of!==undefined){S.of[t.dataset.of]=t.value;clearTimeout(t1);t1=setTimeout(async()=>{try{await loadOL();const k=document.activeElement&&document.activeElement.dataset.of;R();if(k)document.querySelector(`[data-of="${k}"]`).focus()}catch(e){toast(em(e))}},300)}
 else if(t.dataset.cq!==undefined){S.cq=t.value;clearTimeout(t1);t1=setTimeout(async()=>{try{await loadCU();R();const n=document.querySelector('[data-cq]');n.focus();n.setSelectionRange(99,99)}catch(e){toast(em(e))}},300)}});
init();
</script></body></html>
