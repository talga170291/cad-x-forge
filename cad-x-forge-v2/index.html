 return hd({title:nm(p,'title'),back:custom?'cartback':''})+blocksHtml(p)+(docs.length?`<h3 class="h3">${t('docs')}</h3>${docs.map(d=>`<div class="fr" style="margin:0 14px"><span><a href="#" data-a="tab" data-v="page:${esc(d.slug)}" style="color:#000">${esc(nm(d,'title'))}</a></span></div>`).join('')}`:'')};
const navLabel=m=>nm(m,'label');
const nav=()=>{const items=(B().menu&&B().menu.length?B().menu:[{target:'cat',icon:'catalog',label_ru:'Каталог',label_en:'Catalog',label_kk:'Каталог'},{target:'cart',icon:'cart',label_ru:'Корзина',label_en:'Cart',label_kk:'Себет'},{target:'buys',icon:'bag',label_ru:'Покупки',label_en:'Purchases',label_kk:'Сатып алу'},{target:'info',icon:'info',label_ru:'Инфо',label_en:'Info',label_kk:'Ақпарат'}]);
 return `<nav class="nv"><div>${items.map(m=>`<button class="${S.tab==m.target?'on':''}" data-a="tab" data-v="${esc(m.target)}" aria-label="${esc(navLabel(m))}"><span>${svg(m.icon)}</span>${m.target=='cart'&&S.cart.length?`<em>${S.cart.length}</em>`:''}${esc(navLabel(m))}</button>`).join('')}</div></nav>`};
const sheet=()=>{if(!S.sheet)return'';const L=cartLines();
 return `<div class="ov"><div class="bk" data-a="close"></div><div class="sh">`+(S.sheet==3?`<h3>✓ ${esc(S.msg||t('payOk'))}</h3><button class="bt go" data-a="tab" data-v="buys">${t('buys')}</button>`:`<h3>${t('co')}</h3>${L.map(({c,p})=>`<div class="fr"><span>${esc(nm(p))}${c.vid?' <span class="ar">'+esc(vlabel(c.size,c.height))+'</span>':''}</span><b class="pr">${money(p.price_stars)}</b></div>`).join('')}<div class="rt" style="padding:10px 0"><b>${t('tot')}</b><b class="pr">${money(cartTotal())}</b></div><button class="bt go" data-a="pay" ${S.sheet==2?'disabled':''}>${S.sheet==2?t('loading'):t('pay')}</button><button class="bt s" data-a="close">✕</button>`)+`</div></div>`};
const player=()=>S.player?`<div class="pl"><div><video controls playsinline autoplay src="${esc(S.player)}"></video><button class="bt" style="width:100%;margin-top:8px" data-a="closep">${t('close')}</button></div></div>`:'';
function R(){document.documentElement.lang=LANG;const a=$('#app');
 if(S.err){a.innerHTML=hd({lang:true})+`<div class="er">${esc(errMsg(S.err))}<br><button class="bt s" data-a="boot" style="margin-top:8px">${t('retry')}</button></div>`;return}
 if(S.boot&&S.boot.settings.maintenance){a.innerHTML=hd({lang:true})+`<div class="em">${t('errMaint')}</div>`;return}
 const tab=S.tab;let body;
 if(S.pid)body=vPrd();else if(tab==='cat')body=hd({lang:true})+vCat()+nav();else if(tab==='cart')body=vCart()+nav();else if(tab==='buys')body=vBuys()+nav();else body=vPage()+nav();
 a.innerHTML=body+sheet()+player();if(!S.pid&&tab==='cat')renderRes()}
// ===== действия =====
async function pay(){if(S.sheet!==1)return;if(!(TG&&TG.initData&&TG.openInvoice)){toast(t('openInTg'));return}
 S.sheet=2;R();
 try{const r=await API('/api/cart/checkout',{method:'POST',body:{items:S.cart.map(c=>({product_id:c.id,variant_id:c.vid||undefined,size_id:c.size||undefined,height_id:c.height||undefined}))}});
  TG.openInvoice(r.invoice_link,async st=>{if(st==='paid')await waitPaid(r.order.number);else{S.sheet=0;toast(st==='cancelled'?t('payCancelled'):st==='failed'?t('payFailed'):'');R()}})}
 catch(e){S.sheet=0;if(e.code==='items_unavailable'){const d=e.details||{},bad=new Set([...(d.unavailable||[]),...(d.owned||[])]),bv=new Set(d.variants_unavailable||[]);S.cart=S.cart.filter(c=>!bad.has(c.id)&&!bv.has(c.vid));saveCart();await loadBuys();await loadCart()}toast(errMsg(e));R()}}
async function waitPaid(n){for(let i=0;i<25;i++){try{const o=await API('/api/orders/'+n);if(o.status==='paid'){S.cart=[];saveCart();S.cartItems=[];S.msg=t('payOk');await loadBuys();S.sheet=3;R();return}}catch(e){}await new Promise(r=>setTimeout(r,1200))}
 S.sheet=0;toast(t('payWait'));R()}
async function dl(id){try{const r=await API('/api/me/files/'+id+'/link',{method:'POST'});
 if(TG&&TG.downloadFile&&TG.isVersionAtLeast&&TG.isVersionAtLeast('8.0'))TG.downloadFile({url:r.url,file_name:r.filename});else if(TG&&TG.openLink)TG.openLink(r.url);else location.href=r.url}catch(e){toast(errMsg(e))}}
async function watch(id){try{const r=await API('/api/me/files/'+id+'/link?inline=1',{method:'POST'});S.player=r.url;R()}catch(e){toast(errMsg(e))}}
async function openP(id){S.sy=scrollY;S.pid=+id;S.prod=null;S.perr=null;S.img=0;S.sel={size:0,height:0};R();scrollTo(0,0);try{S.prod=await API('/api/products/'+id)}catch(e){S.perr=e}R()}
const setLang=l=>{LANG=l;LS.set('cfx.lang',l);if(TG&&TG.initData)API('/api/me',{method:'PATCH',body:{lang:l}}).catch(()=>{});R()};
async function go(tab){if(tab!==S.tab&&tab!=='cart')S.prev=S.tab;else if(tab==='cart'&&S.tab!=='cart')S.prev=S.tab;S.tab=tab;S.pid=null;S.sheet=0;R();scrollTo(0,0);
 if(tab==='cart')await loadCart();else if(tab==='buys')await loadBuys();else if(tab==='info'||tab.startsWith('page:'))await loadPage(tab==='info'?'info':tab.slice(5));R()}
async function act(a,el){const d=el.dataset,v=d.v;switch(a){
case'tab':await go(v);return;
case'cartback':await go(S.prev&&S.prev!==S.tab?S.prev:'cat');return;
case'f':S.f[d.k]=String(S.f[d.k])===String(v)?'':v;loadList(true);break;
case'showF':S.showF=!S.showF;break;
case'reset':{const q=S.f.q;S.f={q,category:'',audience:'',size:'',height:'',tag:'',format:'',price_min:'',price_max:'',featured:'',sort:'featured'};loadList(true);break}
case'more':S.list.page++;loadList(false);return;
case'retry':loadList(true);return;
case'retryp':await loadPage(S.tab==='info'?'info':S.tab.slice(5));return;
case'boot':S.err=null;init();return;
case'open':await openP(v);return;
case'back':S.pid=null;R();scrollTo(0,S.sy||0);return;
case'gprev':case'gnext':{const n=S.prod?S.prod.images.length:0;if(n){S.img=(S.img+(a==='gnext'?1:n-1))%n}break}
case'sel':S.sel[d.k]=S.sel[d.k]==v?0:+v;break;
case'add':case'now':{const p=S.prod;if(!p||p.id!==+v)break;const vs=variantState(p);let c;
 if(vs.has){if(vs.state!=='ok'||ownedV(p.id,vs.v.id)){toast(t(vs.state==='ok'?'own':'combo'));break}c={id:p.id,vid:vs.v.id,size:vs.v.size_id,height:vs.v.height_id||0}}
 else{if(bought(p.id)){toast(t('own'));break}c={id:p.id,vid:null,size:S.sel.size||0,height:S.sel.height||0}}
 if(!S.cart.some(x=>ck(x)===ck(c)))S.cart.push(c);saveCart();await loadCart();if(a==='add')toast(t('inCart'));else S.sheet=1;break}
case'rm':S.cart=S.cart.filter(c=>ck(c)!==v);saveCart();break;
case'clr':S.cart=[];saveCart();S.cartItems=[];break;
case'co':if(!S.cart.length){toast(t('emp'));break}S.sheet=1;break;
case'close':S.sheet=0;break;
case'closep':S.player=null;break;
case'pay':await pay();return;
case'get':await dl(v);return;
case'watch':await watch(v);return;
case'ext':{const u=d.u||'';if(/^https:\/\/t\.me\//.test(u)&&TG&&TG.openTelegramLink)TG.openTelegramLink(u);else if(TG&&TG.openLink)TG.openLink(u);else window.open(u,'_blank');return}
case'setlang':setLang(v);return}
R()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled){if(b.tagName==='A')e.preventDefault&&e.preventDefault();act(b.dataset.a,b)}});
let qt;document.addEventListener('input',e=>{if(e.target.id==='q'){S.f.q=e.target.value;clearTimeout(qt);qt=setTimeout(()=>loadList(true),300)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.p){S.f[t.dataset.p]=t.value;loadList(true)}else if(t.dataset.s){S.f[t.dataset.s]=t.value;loadList(true)}});
init();
</script></body></html>
