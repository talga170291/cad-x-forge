<style>*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;color:#000;background:#fff}

.im{display:flex;gap:10px;flex-wrap:wrap}.im>div{width:150px;border:1px solid #ddd;padding:6px;font-size:12px}.im img{width:100%;height:120px;object-fit:cover;display:block;margin-bottom:6px;background:#f4f4f4}.im button{padding:3px 7px;font-size:12px;margin:0 2px 2px 0}
.md{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:9;padding:16px}.md>div{background:#fff;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.er{border:1px solid #a00;color:#a00;padding:10px;margin:10px 0}.ok{border:1px solid #000;padding:10px;margin:10px 0}details{border:1px solid #ddd;padding:8px 12px;margin-bottom:8px}summary{cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #eee;padding:4px;text-align:left;vertical-align:middle}td input,td select{width:100%;min-width:60px}#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}#toast.on{opacity:1}
.zn{border:1px dashed #bbb;padding:8px;margin:0 0 14px;min-height:46px}.zn.lib{background:#fafafa}.zn>h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#555}

.bar{height:6px;background:#eee;margin:6px 0}.bar>i{display:block;height:6px;background:#16a34a;width:0}.vr{border:1px solid #ddd;padding:8px;margin-bottom:6px}.vr .row{margin:0}.na{color:#999}.sub{font-size:12px;color:#777}

</style></head><body><div id="app"></div><div id="toast"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../config.js"></script>
<script src="../api.js"></script>
<script>
const $=s=>document.querySelector(s),TG=window.Telegram&&Telegram.WebApp,API=window.cfxApi,U=window.cfxUrl;
const esc=x=>String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const ERR={network:'Нет связи с сервером',unauthorized:'Нет авторизации Telegram',invalid_init_data:'Подпись Telegram неверна — откройте админку из бота (/admin)',init_data_expired:'Сессия устарела — откройте админку из бота заново',forbidden:'Нет доступа: ваш Telegram ID не в списке администраторов',validation:'Проверьте поля формы',duplicate:'Такое значение уже существует (артикул, slug или код)',in_use:'Нельзя удалить: запись используется (скройте её или отвяжите товары)',protected:'Эту запись удалить нельзя (её можно скрыть)',invalid_reference:'Указана несуществующая связанная запись',file_too_large:'Файл слишком большой',invalid_file_type:'Недопустимый тип или содержимое файла',invalid_format:'Неизвестный формат файла',invalid_variant:'Такого варианта нет у этого товара',not_found:'Не найдено',not_ready:'Товар не готов к публикации',not_refundable:'Заказ нельзя вернуть',telegram_error:'Telegram отклонил запрос',server_error:'Ошибка сервера',bad_part_size:'Неверный размер части файла',parts_missing:'Загружены не все части файла',upload_closed:'Загрузка уже закрыта',size_mismatch:'Размер файла не совпал — загрузите заново'};
const em=e=>{let m=ERR[e&&e.code]||'Ошибка: '+(e&&e.code||'unknown');const d=e&&e.details;if(e&&e.code==='not_ready'&&d&&d.missing)m+=': не хватает — '+d.missing.map(x=>({image:'изображения',file:'файла выкройки',variant_files:'файла для каждого доступного варианта',price:'цены ≥ 1 ★',category:'категории',name_ru:'названия'}[x]||x)).join(', ');if(e&&e.code==='validation'&&d&&d.field)m+=' (поле '+d.field+')';if(e&&e.code==='invalid_file_type'&&d&&d.expected)m+=' (нужен .'+d.expected+')';return m};
let tm;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>e.classList.remove('on'),3800)}
const fd=s=>s?new Date(s*1000).toISOString().slice(0,16).replace('T',' '):'—',fs=n=>n>1048576?(n/1048576).toFixed(1)+' МБ':Math.max(1,Math.round(n/1024))+' КБ';
const ST={draft:'черновик',ready:'готов',hidden:'скрыт',archived:'архив',published:'опубликован'},ST_ORDER=['draft','ready','hidden','archived','published'];   // «Опубликовать» — крайняя справа
const ICONS={catalog:'Каталог',cart:'Корзина',bag:'Сумка',info:'Инфо',home:'Дом',heart:'Сердце',star:'Звезда',user:'Профиль',chat:'Чат',book:'Книга',video:'Видео',scissors:'Ножницы',tag:'Ярлык',phone:'Телефон',mail:'Почта',link:'Ссылка',gift:'Подарок',search:'Поиск'};
// Справочники: видимые поля, зоны «рабочая область / неиспользуемые» (flag — колонка, work — значение для рабочей области)
const NM=[['name_ru','RU'],['name_kk','KAZ'],['name_en','EN']];
const DICT_CFG={
 categories:{t:'Категории',f:[...NM,['audience_id','Аудитория','sel:audiences']],flag:'hidden',work:0},
 audiences:{t:'Аудитория (пол)',f:NM,flag:'hidden',work:0},
 size_groups:{t:'Размерные группы',f:NM},
 sizes:{t:'Размеры',f:[['group_id','Группа','sel:size_groups'],['label','Значение']],flag:'hidden',work:0},
 height_groups:{t:'Ростовые группы',f:NM},
 heights:{t:'Ростовки',f:[['group_id','Группа','sel:height_groups'],['label','Значение'],['cm','см','num']],flag:'hidden',work:0},
 tags:{t:'Теги',f:NM,flag:'hidden',work:0},
 attributes:{t:'Характеристики',f:[...NM,['kind','Тип','sel:kind'],['filterable','Фильтр','chk']]},
 attribute_values:{t:'Значения характеристик',f:[['attribute_id','Характеристика','sel:attributes'],['value_ru','RU'],['value_kk','KAZ'],['value_en','EN']]},
 file_formats:{t:'Форматы файлов',f:[['label','Название'],['ext','Расширение'],['code','Код (только при создании)','code']],flag:'active',work:1,pk:'code'}};
const S={tab:'dash',auth:null,err:null,D:{},ed:null,pl:{items:[],total:0,page:1},pf:{q:'',status:'',category:''},dict:'categories',ol:null,cu:null,au:null,st:null,set:null,of:{status:'',q:''},cq:'',
 vsel:{sizes:[],heights:[]},vopen:0,up:null,pg:{list:[],cur:null,lang:'ru'},menu:[]};
async function dicts(){const n=Object.keys(DICT_CFG);const r=await Promise.all(n.map(k=>API('/api/admin/dict/'+k)));n.forEach((k,i)=>S.D[k]=r[i].items)}
const lab=(l,id,f)=>{const x=(S.D[l]||[]).find(y=>y.id==id);return x?(x[f||'name_ru']||x.label||x.slug):''};
async function init(){R();
 if(!(TG&&TG.initData)){S.err={code:'unauthorized'};R();return}
 try{TG.ready();TG.expand()}catch(e){}
 try{const me=await API('/api/me');if(!me.is_admin){S.err={code:'forbidden'};R();return}S.auth=me.user;await dicts();await go('dash')}catch(e){S.err=e;R()}}
async function go(tab){S.tab=tab;S.ed=null;R();try{
 if(tab==='dash'){S.st=await API('/api/admin/stats')}else if(tab==='prod')await loadPL(1);else if(tab==='ord')await loadOL();else if(tab==='cus')await loadCU();else if(tab==='set'){S.set=await API('/api/admin/settings')}else if(tab==='audit'){S.au=(await API('/api/admin/audit')).items}else if(tab==='tax')await dicts();
 else if(tab==='pages'){S.pg.list=(await API('/api/admin/dict/pages')).items;if(S.pg.cur)await openPage(S.pg.cur.slug,true)}else if(tab==='menu'){S.menu=(await API('/api/admin/dict/menu_items')).items;S.pg.list=(await API('/api/admin/dict/pages')).items}}catch(e){toast(em(e))}R()}
async function loadPL(p){const q=new URLSearchParams({page:p,limit:30});for(const k in S.pf)if(S.pf[k])q.set(k,S.pf[k]);S.pl=await API('/api/admin/products?'+q)}
async function loadOL(){const q=new URLSearchParams({limit:30});for(const k in S.of)if(S.of[k])q.set(k,S.of[k]);S.ol=await API('/api/admin/orders?'+q)}
async function loadCU(){S.cu=await API('/api/admin/customers?limit=50'+(S.cq?'&q='+encodeURIComponent(S.cq):''))}
async function openPage(slug,keep){S.pg.cur=await API('/api/admin/pages/'+slug);if(!keep)S.pg.lang='ru'}
const opts=(l,sel,f,empty)=>(empty?'<option value="">—</option>':'')+(S.D[l]||[]).map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(x[f||'name_ru']||x.label)}</option>`).join('');
// ---------- перетаскивание (мышь и сенсорный экран) + кнопки ▲▼ как запасной способ ----------
let drag=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.hg');if(!h)return;const it=h.closest('.dn');if(!it)return;e.preventDefault();
 const r=it.getBoundingClientRect(),ph=document.createElement('div');ph.className='dn ph';ph.style.height=r.height+'px';it.parentNode.insertBefore(ph,it);
 drag={it,ph,dx:e.clientX-r.left,dy:e.clientY-r.top,w:r.width,root:it.closest('[data-dz]')};it.classList.add('drag');it.style.width=r.width+'px';it.style.left=r.left+'px';it.style.top=r.top+'px'});
document.addEventListener('pointermove',e=>{if(!drag)return;drag.it.style.left=(e.clientX-drag.dx)+'px';drag.it.style.top=(e.clientY-drag.dy)+'px';
 const el=document.elementFromPoint(e.clientX,e.clientY);if(!el)return;const over=el.closest('.dn:not(.drag):not(.ph)'),zone=el.closest('.zn');
 if(over&&drag.root&&drag.root.contains(over)){const b=over.getBoundingClientRect();over.parentNode.insertBefore(drag.ph,e.clientY<b.top+b.height/2?over:over.nextSibling)}
 else if(zone&&drag.root&&drag.root.contains(zone)&&!zone.querySelector('.dn:not(.drag):not(.ph)'))zone.appendChild(drag.ph)});
document.addEventListener('pointerup',async()=>{if(!drag)return;const d=drag;drag=null;d.ph.parentNode.insertBefore(d.it,d.ph);d.ph.remove();d.it.classList.remove('drag');d.it.style.cssText='';await saveOrder(d.root)});
function zoneIds(root){const z=n=>[...root.querySelectorAll(`.zn[data-z="${n}"] .dn`)].map(x=>x.dataset.id);return{work:z('work'),library:z('lib')}}
async function saveOrder(root){if(!root)return;const{work,library}=zoneIds(root);const hasLib=!!root.querySelector('.zn[data-z="lib"]');
 try{await API('/api/admin/reorder',{method:'POST',body:{table:root.dataset.dz,work:hasLib?work:[...work,...library],library:hasLib?library:[]}});toast('Порядок сохранён');await refreshDz(root.dataset.dz)}catch(e){toast(em(e));await refreshDz(root.dataset.dz)}R()}
async function refreshDz(table){if(DICT_CFG[table])S.D[table]=(await API('/api/admin/dict/'+table)).items;else if(table==='menu_items')S.menu=(await API('/api/admin/dict/menu_items')).items;else if(table==='page_blocks'&&S.pg.cur)await openPage(S.pg.cur.slug,true)}
async function moveItem(root,id,dir){const items=[...root.querySelectorAll('.dn')],ix=items.findIndex(x=>x.dataset.id===id);if(ix<0)return;const it=items[ix],zone=it.parentNode;
 if(dir==='lib'||dir==='work'){const target=root.querySelector(`.zn[data-z="${dir}"]`);if(target)target.appendChild(it)}
 else{const j=ix+dir,o=items[j];if(!o||o.parentNode!==zone)return;zone.insertBefore(it,dir<0?o:o.nextSibling)}
 await saveOrder(root)}
const zones=(table,rows,render,flagOf,hasLib)=>{const work=rows.filter(r=>!hasLib||flagOf(r)),lib=rows.filter(r=>hasLib&&!flagOf(r));
 const item=(r,inLib)=>`<div class="dn" data-id="${esc(r.__id)}"><span class="hg" title="Перетащите">⠿</span>${render(r)}<span class="bx2"><button class="s" data-a="mv" data-v="${esc(r.__id)}" data-k="-1">▲</button><button class="s" data-a="mv" data-v="${esc(r.__id)}" data-k="1">▼</button>${hasLib?`<button class="s" data-a="mv" data-v="${esc(r.__id)}" data-k="${inLib?'work':'lib'}">${inLib?'Вернуть':'Убрать'}</button>`:''}</span></div>`;
 return `<div data-dz="${table}"><div class="zn" data-z="work">${hasLib?'<h4>Рабочая область</h4>':''}${work.map(r=>item(r,false)).join('')}</div>${hasLib?`<div class="zn lib" data-z="lib"><h4>Неиспользуемые (данные сохраняются)</h4>${lib.map(r=>item(r,true)).join('')}</div>`:''}</div>`};
// ---------- представления ----------
const V={
dash(){const s=S.st;if(!s)return'<h2>Главная</h2><p class="mu">Загрузка…</p>';const pr=s.products,or=s.orders,n=o=>o||0;
 return `<h2>Главная</h2><div class="g"><div class="c"><b>${ST_ORDER.reduce((a,k)=>a+n(pr[k]),0)}</b>товаров</div><div class="c"><b>${n(pr.published)}</b>опубликовано</div><div class="c"><b>${n(pr.draft)+n(pr.ready)}</b>черновики и готовые</div><div class="c"><b>${n(or.paid)}</b>оплаченных заказов</div><div class="c"><b>★ ${s.sales_stars}</b>продажи</div><div class="c"><b>${s.users}</b>пользователей</div></div>
 <h2>Последние заказы</h2>${s.recent_orders.map(o=>`<div class="it"><b>${esc(o.number)}</b><span>${esc(o.status)}</span><span>★ ${o.total_stars}</span><span class="mu">${esc(o.username?'@'+o.username:o.first_name||'')} · ${fd(o.created_at)}</span></div>`).join('')||'<p class="mu">Заказов пока нет.</p>'}
 <h2>Продажи за 14 дней</h2>${s.daily.map(d=>`<div class="it"><b>${esc(d.day)}</b><span>${d.orders} зак.</span><span>★ ${d.stars}</span></div>`).join('')||'<p class="mu">Нет оплат.</p>'}`},
prod(){const p=S.pl;return `<h2>Товары</h2><div class="row"><input data-pf="q" placeholder="Поиск: название, артикул" value="${esc(S.pf.q)}"><select data-pf="status"><option value="">Любой статус</option>${ST_ORDER.map(k=>`<option value="${k}" ${S.pf.status===k?'selected':''}>${ST[k]}</option>`).join('')}</select><select data-pf="category">${opts('categories',S.pf.category,'name_ru',true)}</select><button class="b" data-a="new">+ Добавить товар</button></div>
 ${p.items.map(x=>`<div class="it">${x.image?`<img class="t" src="${esc(U(x.image))}" alt="">`:'<div class="t"></div>'}<div class="m"><b>${esc(x.name_ru)}</b><span class="tg ${x.status==='published'?'':'d'}">${ST[x.status]}</span>${x.has_variants&&!x.in_stock?'<span class="tg d">нет в наличии</span>':''}<small>${esc(x.sku)} · ${esc(lab('categories',x.category_id))} · ★ ${x.price_stars} · ${x.formats.join(', ')||'нет файлов'} · изм. ${fd(x.updated_at)}</small></div><div class="a"><button class="s" data-a="edit" data-v="${x.id}">Изменить</button>${x.status!=='archived'?`<button class="s" data-a="st" data-v="${x.id}" data-k="archived">В архив</button>`:''}<button class="s x" data-a="del" data-v="${x.id}">Удалить</button>${x.status==='published'?`<button class="s" data-a="st" data-v="${x.id}" data-k="hidden">Снять с публикации</button>`:`<button class="b" data-a="st" data-v="${x.id}" data-k="published">Опубликовать</button>`}</div></div>`).join('')||'<p class="mu">Ничего не найдено.</p>'}
 <div class="row"><span class="mu">Всего: ${p.total}</span>${p.page>1?'<button class="s" data-a="pg" data-v="-1">‹ Назад</button>':''}${p.page*30<p.total?'<button class="s" data-a="pg" data-v="1">Далее ›</button>':''}</div>`},
form(){const p=S.ed,id=p.id,D=S.D,nw=!id,inp=(k,l,t,w)=>`<label class="${w||''}">${l}<input type="${t||'text'}" data-f="${k}" value="${esc(p[k]==null?'':p[k])}"${t==='number'?' min="0"':''}></label>`;
 const grp=(sl,gl,sel,key)=>(D[gl]||[]).map(g=>{const it=(D[sl]||[]).filter(x=>x.group_id===g.id&&!x.hidden);return it.length?`<div class="mu">${esc(g.name_ru)}</div><div>${it.map(x=>`<span class="ch ${sel.includes(x.id)?'on':''}" data-a="tgl" data-k="${key}" data-v="${x.id}">${esc(x.label)}</span>`).join('')}</div>`:''}).join('');
 const attr=(D.attributes||[]).map(a=>{const cur=(p.attributes||[]).find(x=>x.attribute_id===a.id)||{};return a.kind==='text'?`<label>${esc(a.name_ru)}<input data-at="${a.id}" data-t="text" value="${esc(cur.text_value||'')}"></label>`:`<label>${esc(a.name_ru)}<select data-at="${a.id}" data-t="choice"><option value="">—</option>${(D.attribute_values||[]).filter(v=>v.attribute_id===a.id).map(v=>`<option value="${v.id}" ${cur.value_id===v.id?'selected':''}>${esc(v.value_ru)}</option>`).join('')}</select></label>`}).join('');

function pickFile(accept,cb){const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>{if(i.files[0])cb(i.files[0])};i.click()}
function shrink(f,max){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no({code:'invalid_file_type'}),'image/jpeg',.85)};im.onerror=()=>no({code:'invalid_file_type'});im.src=r.result};r.readAsDataURL(f)})}
const up=(path,blob)=>API(path,{method:'POST',body:blob});
const BIG=20*1048576;
function prog(t,pct){const e=$('#upst');if(e)e.innerHTML=t?`<div class="sub">${esc(t)}</div><div class="bar"><i style="width:${pct||0}%"></i></div>`:''}
// Загрузка большого файла по частям: после обрыва выберите тот же файл — загрузка продолжится с последней части.
async function bigUpload(f,pid,vid,format){const key=`cfx.up.${pid}.${vid||0}.${format}.${f.name}.${f.size}`;let id=LS.get(key,null),st=null;
 if(id){try{st=await API('/api/admin/uploads/'+id);if(st.status!=='open')id=null}catch(e){id=null}}
 if(!id){const s=await API('/api/admin/uploads',{method:'POST',body:{product_id:pid,variant_id:vid||undefined,format,filename:f.name,size:f.size}});id=s.id;LS.set(key,id);st={parts:[],part_size:s.part_size,parts_total:s.parts_total}}
 const have=new Set(st.parts);
 for(let n=1;n<=st.parts_total;n++){prog(`${f.name}: часть ${n} из ${st.parts_total}`,Math.round((n-1)/st.parts_total*100));if(have.has(n))continue;
  const blob=f.slice((n-1)*st.part_size,Math.min(f.size,n*st.part_size));let ok=false,last;
  for(let t=0;t<3&&!ok;t++){try{await API(`/api/admin/uploads/${id}/parts/${n}`,{method:'PUT',body:blob});ok=true}catch(e){last=e;if(e&&e.code&&e.code!=='network')throw e}}
  if(!ok)throw last||{code:'network'}}
 prog('Завершение загрузки…',99);const row=await up(`/api/admin/uploads/${id}/complete`);LS.del(key);prog('');return row}
async function uploadAny(f,pid,vid,format){if(f.size>BIG)return bigUpload(f,pid,vid,format);prog(f.name,50);const r=await up(`/api/admin/upload/file?product_id=${pid}&format=${format}&filename=${encodeURIComponent(f.name)}${vid?'&variant_id='+vid:''}`,f);prog('');return r}

case'idel':if(!confirm('Удалить изображение?'))return;await API('/api/admin/images/'+v,{method:'DELETE'});await reload(S.ed.id);return;
case'imain':await API(`/api/admin/images/${v}/main`,{method:'POST'});await reload(S.ed.id);return;
case'imv':{const ids=S.ed.images.map(i=>i.id),i=ids.indexOf(Number(v)),j=i+Number(d.k);if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];await API(`/api/admin/products/${S.ed.id}/images/order`,{method:'POST',body:{ids}});await reload(S.ed.id);return}
case'fup':pickFile('.'+d.k,async f=>{try{toast('Загрузка файла…');await uploadAny(f,S.ed.id,Number(d.vid)||null,v);toast('Файл загружен');await reload(S.ed.id)}catch(e){prog('');toast(em(e)+(e&&e.code==='network'?' — выберите тот же файл ещё раз, загрузка продолжится':''))}});return;
case'fdel':if(!confirm('Отключить файл? Покупатели его больше не получат, пока вы не загрузите новый.'))return;await API('/api/admin/files/'+v,{method:'DELETE'});await reload(S.ed.id);return;
case'dict':S.dict=v;break;
case'dsave':{const k=S.dict,c=DICT_CFG[k],row=v==='new'?el.closest('[data-newrow]'):el.closest('[data-row]'),o={};
 c.f.forEach(([f,,t])=>{const e=row.querySelector(`[data-d="${f}"]`);if(!e)return;o[f]=t==='chk'?(e.checked?1:0):(t==='num'||(t&&t.startsWith('sel:')&&t!=='sel:kind'))?(e.value===''?null:Number(e.value)):e.value});
 if(v==='new')await API('/api/admin/dict/'+k,{method:'POST',body:o});else{delete o.code;await API(`/api/admin/dict/${k}/${v}`,{method:'PUT',body:o})}toast('Сохранено');await dicts();break}
case'ddel':if(!confirm('Удалить запись?'))return;await API(`/api/admin/dict/${S.dict}/${v}`,{method:'DELETE'});toast('Удалено');await dicts();break;
case'mv':{const root=el.closest('[data-dz]');await moveItem(root,v,d.k==='lib'||d.k==='work'?d.k:Number(d.k));return}
case'popen':await openPage(v);break;
case'padd':{const t=$('#np').value.trim();if(!t){toast('Введите название страницы');return}const r=await API('/api/admin/dict/pages',{method:'POST',body:{title_ru:t,title_en:t,kind:$('#npk').value}});S.pg.list=(await API('/api/admin/dict/pages')).items;await openPage(r.slug);toast('Страница создана');break}
case'ptsave':{const o={};document.querySelectorAll('[data-pt]').forEach(e=>o[e.dataset.pt]=e.value);if(!o.title_ru.trim()){toast('Укажите название на русском');return}await API('/api/admin/dict/pages/'+S.pg.cur.id,{method:'PUT',body:o});S.pg.list=(await API('/api/admin/dict/pages')).items;await openPage(S.pg.cur.slug,true);toast('Сохранено');break}
case'pvis':await API('/api/admin/dict/pages/'+S.pg.cur.id,{method:'PUT',body:{visible:S.pg.cur.visible?0:1}});S.pg.list=(await API('/api/admin/dict/pages')).items;await openPage(S.pg.cur.slug,true);break;
case'pdel':if(!confirm('Удалить страницу вместе с блоками и пунктом меню?'))return;await API('/api/admin/dict/pages/'+S.pg.cur.id,{method:'DELETE'});S.pg.cur=null;S.pg.list=(await API('/api/admin/dict/pages')).items;toast('Страница удалена');break;
case'blang':S.pg.lang=v;break;
case'badd':{const base=v==='button'?{url:'https://t.me/'}:{};await API(`/api/admin/pages/${S.pg.cur.id}/blocks`,{method:'POST',body:{type:v,data:base}});await openPage(S.pg.cur.slug,true);break}
case'bsave':{const b=S.pg.cur.blocks.find(x=>x.id===Number(v));await API('/api/admin/blocks/'+v,{method:'PUT',body:{data:b.data}});toast('Блок сохранён');await openPage(S.pg.cur.slug,true);break}
case'bdel':if(!confirm('Удалить блок?'))return;await API('/api/admin/blocks/'+v,{method:'DELETE'});await openPage(S.pg.cur.slug,true);break;
case'bimg':pickFile('image/*',async f=>{try{const r=await up('/api/admin/upload/image?kind=content',await shrink(f,1200));const b=S.pg.cur.blocks.find(x=>x.id===Number(v));b.data.key=r.key;b.data.url=r.url;await API('/api/admin/blocks/'+v,{method:'PUT',body:{data:{...b.data,url:undefined}}});toast('Изображение загружено');await openPage(S.pg.cur.slug,true);R()}catch(e){toast(em(e))}});return;
case'msave':{const row=v==='new'?el.closest('[data-newrow]'):el.closest('[data-row]'),o={};row.querySelectorAll('[data-d]').forEach(e=>o[e.dataset.d]=e.value);if(v==='new'){o.sort=99;o.visible=1;await API('/api/admin/dict/menu_items',{method:'POST',body:o})}else await API('/api/admin/dict/menu_items/'+v,{method:'PUT',body:o});toast('Сохранено');S.menu=(await API('/api/admin/dict/menu_items')).items;break}

 ['msg_welcome','msg_paid'].forEach(k=>{o[k]={};document.querySelectorAll(`[data-ms^="${k}:"]`).forEach(e=>{if(e.value.trim())o[k][e.dataset.ms.split(':')[1]]=e.value.trim()})});
 if(!o.languages.length){toast('Выберите хотя бы один язык');return}S.set=await API('/api/admin/settings',{method:'PUT',body:o});toast('Настройки сохранены');break}
case'logo':pickFile('image/*',async f=>{try{await up('/api/admin/upload/image?kind=logo',await shrink(f,600));toast('Логотип загружен');S.set=await API('/api/admin/settings')}catch(e){toast(em(e))}});return;

catch(e){toast(em(e));if(e&&['unauthorized','invalid_init_data','init_data_expired'].includes(e.code)){S.err=e}}R()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled&&b.type!=='checkbox')act(b.dataset.a,b)});

 else if(t.dataset.at&&S.ed){const id=Number(t.dataset.at);S.ed.attributes=(S.ed.attributes||[]).filter(x=>x.attribute_id!==id);if(t.value)S.ed.attributes.push(t.dataset.t==='text'?{attribute_id:id,text_value:t.value}:{attribute_id:id,value_id:Number(t.value)})}

 else if(t.dataset.pf!==undefined){S.pf[t.dataset.pf]=t.value;clearTimeout(t1);t1=setTimeout(async()=>{try{await loadPL(1);const q=document.activeElement;const k=q&&q.dataset.pf,s=q&&q.selectionStart;R();if(k){const n=document.querySelector(`[data-pf="${k}"]`);if(n){n.focus();try{n.setSelectionRange(s,s)}catch(e){}}}}catch(e){toast(em(e))}},300)}
 else if(t.dataset.of!==undefined){S.of[t.dataset.of]=t.value;clearTimeout(t1);t1=setTimeout(async()=>{try{await loadOL();const k=document.activeElement&&document.activeElement.dataset.of;R();if(k)document.querySelector(`[data-of="${k}"]`).focus()}catch(e){toast(em(e))}},300)}
 else if(t.dataset.cq!==undefined){S.cq=t.value;clearTimeout(t1);t1=setTimeout(async()=>{try{await loadCU();R();const n=document.querySelector('[data-cq]');n.focus();n.setSelectionRange(99,99)}catch(e){toast(em(e))}},300)}});
