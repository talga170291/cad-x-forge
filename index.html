const vBuys=()=>`<h2 class="h">${t("buys")}</h2>`+(S.buys.length?S.buys.map(b=>`<div class="bx"><div class="rt" style="padding:0 0 8px"><b>${t("ord")} ${b.o}</b><span class="ar">${b.d} · ★ ${sum(b)}</span></div>${b.ids.map(id=>{const p=pf(id);return`<div>${nm(p)} <span class="ar">${p.a}</span></div>`+F.map(f=>`<div class="fr"><span>${f[3]} ${f[0]}</span><button class="bt s" style="padding:8px 12px" data-a="get" data-v="${nm(p)} — ${f[0]}">${t("get")}</button></div>`).join("")}).join("")}</div>`).join(""):`<div class="em">${t("nb")}</div>`);
const vInfo=()=>`<h2 class="h">CAD x FORGE</h2><p class="pd">${t("ab")}</p><h3 class="h3">${t("how")}</h3><ol class="pd">${t("st").map(x=>`<li>${x}</li>`).join("")}</ol><h3 class="h3">${t("fm")}</h3>${fmr()}<h3 class="h3">FAQ</h3>${t("fq").map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join("")}<h3 class="h3">${t("sup")}</h3><div class="pd"><p>${t("sp")}</p><button class="bt" data-a="sup">${t("wr")}</button></div><p class="pd ar">${t("pt")}</p>`;
const nav=()=>`<nav class="nv"><div>${[["cat","▦",t("cat")],["cart","🛒",t("cart")],["buys","📦",t("buys")],["info","ℹ",t("info")]].map(n=>`<button class="${S.tab==n[0]?"on":""}" data-a="tab" data-v="${n[0]}"><span>${n[1]}</span>${n[0]=="cart"&&S.cart.length?`<em>${S.cart.length}</em>`:""}${n[2]}</button>`).join("")}</div></nav>`;
const sheet=()=>!S.sheet||(S.sheet<3&&!S.cart.length)?"":`<div class="ov"><div class="bk" data-a="close"></div><div class="sh">`+(S.sheet==3?`<h3>✓ ${t("ok")}</h3><button class="bt" data-a="tab" data-v="buys">${t("buys")}</button>`:`<h3>${t("ord")} ${nextNo()}</h3>${S.cart.map(id=>`<div class="fr"><span>${nm(pf(id))}</span><b class="pr">★ ${pf(id).r}</b></div>`).join("")}<div class="rt" style="padding:10px 0"><b>${t("tot")}</b><b class="pr">★ ${tot()}</b></div><button class="bt" data-a="pay" ${S.sheet==2?"disabled":""}>${t("pay")}</button><button class="bt s" data-a="close">✕</button>`)+`</div></div>`;
function R(){const d=document.documentElement,k=S.pid?"p"+S.pid:S.tab,sl=k===S.k?[...document.querySelectorAll(".rw")].map(e=>e.scrollLeft):[];S.k=k;d.lang=S.lang;S.theme=="auto"?delete d.dataset.theme:d.dataset.theme=S.theme;$("#app").innerHTML=(S.pid?vPrd():hd()+{cat:vCat,cart:vCart,buys:vBuys,info:vInfo}[S.tab]()+nav())+sheet();document.querySelectorAll(".rw").forEach((e,i)=>{e.scrollLeft=sl[i]||0});if(!S.pid&&S.tab=="cat")upd();LS.set("lang",S.lang);LS.set("theme",S.theme);LS.set("cart",S.cart);LS.set("buys",S.buys)}
let tm;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tm);tm=setTimeout(()=>e.classList.remove("on"),2200)}
function act(a,v){switch(a){
case"tab":S.tab=v;S.pid=null;S.sheet=0;scrollTo(0,0);break;
case"all":S.cat=null;break;
case"cat":S.cat=+v;break;
case"u":S.u=S.u===v?"":v;break;
case"sz":S.sz=S.sz===+v?0:+v;break;
case"open":S.sy=scrollY;S.pid=+v;S.img=0;scrollTo(0,0);break;
case"back":S.pid=null;R();scrollTo(0,S.sy||0);return;
case"img":S.img=+v;break;
case"add":if(!vid(+v))break;if(own(+v)){toast(t("own"));break}if(!S.cart.includes(+v)){S.cart.push(+v);toast(t("added"))}break;
case"now":if(!vid(+v))break;if(own(+v)){toast(t("own"));break}if(!S.cart.includes(+v))S.cart.push(+v);S.sheet=1;break;
case"rm":S.cart=S.cart.filter(x=>x!=v);break;
case"clr":S.cart=[];break;
case"co":if(!S.cart.length){toast(t("emp"));break}S.sheet=1;break;
case"close":S.sheet=0;break;
case"pay":{if(S.sheet!==1)return;S.cart=S.cart.filter(id=>!own(id));if(!S.cart.length){S.sheet=0;toast(t("emp"));break}S.sheet=2;R();setTimeout(()=>{const ids=[...S.cart];if(!ids.length){S.sheet=0;R();return}S.buys.unshift({o:nextNo(),d:today(),ids,a:ids.reduce((x,id)=>x+pf(id).r,0)});S.cart=[];S.sheet=3;R()},900);return}
case"get":toast(t("sent")+" "+v);return;
case"lang":S.lang=S.lang=="ru"?"en":"ru";break;
case"theme":S.theme={auto:"light",light:"dark",dark:"auto"}[S.theme];break;
case"sup":toast(t("sd"));return}R()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&!b.disabled)act(b.dataset.a,b.dataset.v)});
document.addEventListener("input",e=>{if(e.target.id=="q"){S.q=e.target.value;upd()}});
R();
</script></body></html>
