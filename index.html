 try{[S.boot,S.fac]=await Promise.all([API('/api/bootstrap'),API('/api/facets')])}catch(e){S.err=e;R();return}
 const st=S.boot.settings,langs=st.languages||['ru','kk','en'];let l=LS.get('cfx.lang',null);
 if(!l){const c=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user&&TG.initDataUnsafe.user.language_code;l=c&&langs.includes(c.slice(0,2))?c.slice(0,2):(langs.includes(st.default_lang)?st.default_lang:'en')}
 LANG=langs.includes(l)?l:'en';
 if(new URLSearchParams(location.search).get('tab')==='purchases')S.tab='buys';
 R();loadList(true);
 if(TG&&TG.initData){try{S.me=await API('/api/me');if(!LS.get('cfx.lang',null)&&S.me.user.lang&&langs.includes(S.me.user.lang))LANG=S.me.user.lang}catch(e){}await loadBuys();if(S.cart.length)await loadCart()}
 else if(S.cart.length)await loadCart();
 R()}
// ===== представления =====
const hd=l=>{const st=B().settings,langs=st.languages||['ru','kk','en'],nx=langs[(langs.indexOf(LANG)+1)%langs.length];
 return `<div class="hd">${l||'<b class="lg">'+(st.logo?`<img src="${esc(U(st.logo))}" alt="" height="22" style="vertical-align:middle;margin-right:8px">`:'')+esc(st.store_name||'CAD x FORGE')+'</b>'}<span style="flex:1"></span><button class="ib" data-a="lang" aria-label="${t('lang')}">${nx.toUpperCase()}</button></div>`};
const chip=(a,k,v,on,l)=>`<button class="ch ${on?'on':''}" data-a="${a}" data-k="${k}" data-v="${esc(v)}">${esc(l)}</button>`;
function catChips(){const c=S.fac?S.fac.categories:[],cnt={};B().categories.forEach(x=>{const n=(c.find(y=>y.id==x.id)||{n:0}).n;cnt[x.id]=(cnt[x.id]||0)+n;if(x.parent_id)cnt[x.parent_id]=(cnt[x.parent_id]||0)+n});
 return chip('f','category','',S.f.category==='',t('all'))+B().categories.filter(x=>cnt[x.id]>0).map(x=>chip('f','category',x.id,S.f.category==x.id,nm(x))).join('')}
function filterPanel(){const F=S.fac||{},has=(l,id)=>(F[l]||[]).some(x=>x.id==id),row=(label,html)=>html?`<div class="rw"><span class="ar">${label}</span>${html}</div>`:'';
 const sizes=B().sizes.filter(x=>has('sizes',x.id)).map(x=>chip('f','size',x.id,S.f.size==x.id,x.label)).join(''),hs=B().heights.filter(x=>has('heights',x.id)).map(x=>chip('f','height',x.id,S.f.height==x.id,x.label)).join('');
 return `<div class="fx">${row(t('audience'),B().audiences.filter(x=>has('audiences',x.id)).map(x=>chip('f','audience',x.id,S.f.audience==x.id,nm(x))).join(''))}${row(t('size'),sizes)}${row(t('height'),hs)}${row(t('tag'),B().tags.filter(x=>has('tags',x.id)).map(x=>chip('f','tag',x.id,S.f.tag==x.id,nm(x))).join(''))}${row(t('format'),B().formats.filter(x=>(F.formats||[]).some(y=>y.code==x.code)).map(x=>chip('f','format',x.code,S.f.format==x.code,x.label)).join(''))}
 <div class="rw"><span class="ar">${t('price')}</span><input class="pi" type="number" min="0" data-p="price_min" placeholder="${t('from')}" value="${esc(S.f.price_min)}"><input class="pi" type="number" min="0" data-p="price_max" placeholder="${t('to')}" value="${esc(S.f.price_max)}"></div>
 <div class="rw">${chip('f','featured','1',S.f.featured==='1',t('featuredOnly'))}<select data-s="sort" aria-label="${t('sort')}">${['featured','new','price_asc','price_desc','popular'].map(k=>`<option value="${k}" ${S.f.sort===k?'selected':''}>${t('sort_'+k)}</option>`).join('')}</select><button class="ch" data-a="reset">${t('reset')}</button></div></div>`}
const vCat=()=>`<div style="padding:12px 14px 4px"><input id="q" class="in" placeholder="${t('search')}" value="${esc(S.f.q)}" autocomplete="off"></div><div class="rw">${catChips()}</div><div class="btn-row"><button class="ch ${S.showF?'on':''}" data-a="showF">${t('filters')}</button></div>${S.showF?filterPanel():''}<div id="res"></div>`;
const card=p=>`<div class="cd" data-a="open" data-v="${p.id}"><div class="im">${imgT(p.image,nm(p))}</div><div style="padding:10px"><div class="ar">${esc(p.sku)}</div><div>${esc(nm(p))}</div><span class="pr">${money(p.price_stars)}</span>${owned(p.id)?`<span class="bd">✓ ${t('own')}</span>`:''}</div></div>`;
function renderRes(){const e=$('#res');if(!e)return;const L=S.list;
 if(L.err){e.innerHTML=`<div class="er">${esc(errMsg(L.err))}<br><button class="bt s" data-a="retry" style="margin-top:8px">${t('retry')}</button></div>`;return}
 let h=`<div class="ar" style="padding:8px 14px 0">${t('found')}: ${L.total}</div>`;
 if(L.items.length)h+=`<div class="gd">${L.items.map(card).join('')}</div>`;else if(!L.loading)h+=`<div class="em">${t('none')}</div>`;
 if(L.loading)h+=`<div class="gd">${'<div class="sk"></div>'.repeat(L.items.length?2:4)}</div>`;
 else if(L.items.length<L.total)h+=`<div class="btn-row"><button class="bt s" style="flex:1" data-a="more">${t('loadMore')}</button></div>`;
 e.innerHTML=h}
function vPrd(){const p=S.prod;const head=hd(`<button class="ib" data-a="back" aria-label="${t('back')}">‹</button><b class="ar">${p?esc(p.sku):''}</b>`);
 if(S.perr)return head+`<div class="er">${esc(errMsg(S.perr))}</div>`;if(!p)return head+`<div class="gd"><div class="sk"></div></div>`;
 const imgs=p.images,cur=imgs[S.img]||imgs[0],o=owned(p.id),ic=S.cart.some(c=>c.id==p.id),b=B();
 const val=a=>{const v=byId(b.attribute_values,a.value_id);return v?nm(v,'value'):esc(a.text_value)};
 const attrs=p.attributes.map(a=>{const d=byId(b.attributes,a.attribute_id);return d?`<span>${esc(nm(d))}</span><b>${val(a)}</b>`:''}).join('');
 return head+`<div class="im big">${imgT(cur&&cur.url,nm(p))}</div>${imgs.length>1?`<div class="rw">${imgs.map((x,i)=>chip('img','i',i,S.img==i,'#'+(i+1))).join('')}</div>`:''}
 <div class="pd"><h2 class="h2">${esc(nm(p))}</h2><div class="ar">${t('sku')}: ${esc(p.sku)} · ${esc(nm(byId(b.categories,p.category_id)))} · ${esc(nm(byId(b.audiences,p.audience_id)))}</div><div class="pr" style="font-size:22px;margin-top:6px">${money(p.price_stars)}</div>${p.tags.length?`<div style="margin-top:6px">${p.tags.map(x=>`<span class="bd" style="margin:0 6px 0 0">${esc(nm(byId(b.tags,x.id)))}</span>`).join('')}</div>`:''}</div>
 <p class="pd">${esc(nm(p,'desc'))}</p>
 <div class="sp"><span>${t('sizes')}</span><b>${p.sizes.map(x=>esc(x.label)).join(', ')||'—'}</b><span>${t('heights')}</span><b>${p.heights.map(x=>esc(x.label)).join(', ')||'—'}</b>${p.pieces_count?`<span>#</span><b>${p.pieces_count}</b>`:''}${attrs}</div>
 ${!o&&p.sizes.length?`<h3 class="h3">${t('yourSize')}</h3><div class="rw">${p.sizes.map(x=>chip('sel','size',x.id,S.sel.size==x.id,x.label)).join('')}</div>`:''}${!o&&p.heights.length?`<h3 class="h3">${t('yourHeight')}</h3><div class="rw">${p.heights.map(x=>chip('sel','height',x.id,S.sel.height==x.id,x.label)).join('')}</div>`:''}
 <h3 class="h3">${t('includes')}</h3>${p.files.map(f=>{const fm=(b.formats.find(x=>x.code==f.format)||{label:f.format});return `<div class="fr" style="margin:0 14px"><span>📄 <b>${esc(fm.label)}</b></span><span class="ar">${fsize(f.size)}</span></div>`}).join('')||`<p class="pd ar">—</p>`}
 <p class="pd ar">${t('digital')}</p>
 <div class="cta">${o?`<button class="bt s" style="flex:1" data-a="tab" data-v="buys">✓ ${t('own')} · ${t('openBuys')}</button>`:`<button class="bt s" style="flex:1" data-a="${ic?'tab':'add'}" data-v="${ic?'cart':p.id}">${ic?t('inCart'):t('add')}</button><button class="bt" style="flex:1" data-a="now" data-v="${p.id}">${t('now')}</button>`}</div>`}
const cartTotal=()=>S.cartItems.filter(i=>S.cart.some(c=>c.id==i.id)).reduce((s,i)=>s+i.price_stars,0);
const vCart=()=>{const its=S.cartItems.filter(i=>S.cart.some(c=>c.id==i.id));return `<h2 class="h">${t('cart')}</h2>`+(its.length?its.map(p=>`<div class="li"><div class="im th">${imgT(p.image)}</div><div><div class="ar">${esc(p.sku)}</div><div>${esc(nm(p))}</div><b class="pr">${money(p.price_stars)}</b></div><button class="ib" data-a="rm" data-v="${p.id}" aria-label="${t('rm')}">✕</button></div>`).join('')+`<div class="rt"><b>${t('tot')}</b><b class="pr">${money(cartTotal())}</b></div><div class="rt"><button class="bt s" data-a="clr">${t('clr')}</button><button class="bt" style="flex:1" data-a="co">${t('co')}</button></div>`:`<div class="em"><p>${t('emp')}</p><button class="bt" data-a="tab" data-v="cat">${t('cat')}</button></div>`)};
const dstr=ts=>new Date(ts*1000).toISOString().slice(0,10);
const vBuys=()=>`<h2 class="h">${t('buys')}</h2>`+(!(TG&&TG.initData)?`<div class="em">${t('openTg')}</div>`:!S.buys?`<div class="gd"><div class="sk"></div></div>`:S.buys.err?`<div class="er">${esc(errMsg(S.buys.err))}</div>`:S.buys.items.length?S.buys.items.map(it=>`<div class="bx"><div class="rt" style="padding:0 0 8px"><b>${t('ord')} ${esc(it.order_number)}</b><span class="ar">${dstr(it.paid_at||it.created_at)} · ${money(it.price_stars)}</span></div><div>${esc(nm(it))} <span class="ar">${esc(it.sku)}</span></div>${it.files.map(f=>`<div class="fr"><span>📄 ${esc((B().formats.find(x=>x.code==f.format)||{label:f.format}).label)} <span class="ar">v${f.version} · ${fsize(f.size)}</span></span><button class="bt s" style="padding:8px 12px" data-a="get" data-v="${f.id}">${t('get')}</button></div>`).join('')||`<div class="ar">${t('unavail')}</div>`}</div>`).join(''):`<div class="em">${t('nb')}</div>`);
const vInfo=()=>{const st=B().settings;return `<h2 class="h">${esc(st.store_name||'CAD x FORGE')}</h2><p class="pd">${esc(st.store_description||t('about'))}</p><h3 class="h3">${t('how')}</h3><ol class="pd">${t('steps').map(x=>`<li>${x}</li>`).join('')}</ol><h3 class="h3">FAQ</h3>${t('faq').map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('')}<h3 class="h3">${t('support')}</h3><div class="pd"><p>${t('supportText')} ${esc(st.support_username||'')}</p></div><h3 class="h3">${t('lang')}</h3><div class="rw">${(st.languages||['ru','kk','en']).map(l=>chip('setlang','l',l,LANG===l,l.toUpperCase())).join('')}</div>`};
const nav=()=>`<nav class="nv"><div>${[['cat','▦',t('cat')],['cart','🛒',t('cart')],['buys','📦',t('buys')],['info','ℹ',t('info')]].map(n=>`<button class="${S.tab==n[0]?'on':''}" data-a="tab" data-v="${n[0]}"><span>${n[1]}</span>${n[0]=='cart'&&S.cart.length?`<em>${S.cart.length}</em>`:''}${n[2]}</button>`).join('')}</div></nav>`;
const sheet=()=>{if(!S.sheet)return'';const its=S.cartItems.filter(i=>S.cart.some(c=>c.id==i.id));
 return `<div class="ov"><div class="bk" data-a="close"></div><div class="sh">`+(S.sheet==3?`<h3>✓ ${esc(S.msg||t('payOk'))}</h3><button class="bt" data-a="tab" data-v="buys">${t('buys')}</button>`:`<h3>${t('co')}</h3>${its.map(p=>`<div class="fr"><span>${esc(nm(p))}</span><b class="pr">${money(p.price_stars)}</b></div>`).join('')}<div class="rt" style="padding:10px 0"><b>${t('tot')}</b><b class="pr">${money(cartTotal())}</b></div><button class="bt" data-a="pay" ${S.sheet==2?'disabled':''}>${S.sheet==2?t('loading'):t('pay')}</button><button class="bt s" data-a="close">✕</button>`)+`</div></div>`};
function R(){document.documentElement.lang=LANG;const a=$('#app');
 if(S.err){a.innerHTML=hd()+`<div class="er">${esc(errMsg(S.err))}<br><button class="bt s" data-a="boot" style="margin-top:8px">${t('retry')}</button></div>`;return}
 if(S.boot&&S.boot.settings.maintenance){a.innerHTML=hd()+`<div class="em">${t('errMaint')}</div>`;return}
 a.innerHTML=(S.pid?vPrd():hd()+{cat:vCat,cart:vCart,buys:vBuys,info:vInfo}[S.tab]()+nav())+sheet();if(!S.pid&&S.tab=='cat')renderRes()}
// ===== действия =====
async function pay(){if(S.sheet!==1)return;if(!(TG&&TG.initData&&TG.openInvoice)){toast(t('openInTg'));return}
 S.sheet=2;R();
 try{const r=await API('/api/cart/checkout',{method:'POST',body:{items:S.cart.map(c=>({product_id:c.id,size_id:c.size||undefined,height_id:c.height||undefined}))}});
  TG.openInvoice(r.invoice_link,async st=>{if(st==='paid')await waitPaid(r.order.number);else{S.sheet=0;toast(st==='cancelled'?t('payCancelled'):st==='failed'?t('payFailed'):'');R()}})}
 catch(e){S.sheet=0;if(e.code==='items_unavailable'){await loadBuys();await loadCart()}toast(errMsg(e));R()}}
async function waitPaid(n){for(let i=0;i<25;i++){try{const o=await API('/api/orders/'+n);if(o.status==='paid'){S.cart=[];saveCart();S.cartItems=[];S.msg=t('payOk');await loadBuys();S.sheet=3;R();return}}catch(e){}await new Promise(r=>setTimeout(r,1200))}
 S.sheet=0;toast(t('payWait'));R()}
async function dl(id){try{const r=await API('/api/me/files/'+id+'/link',{method:'POST'});
 if(TG&&TG.downloadFile&&TG.isVersionAtLeast&&TG.isVersionAtLeast('8.0'))TG.downloadFile({url:r.url,file_name:r.filename});else if(TG&&TG.openLink)TG.openLink(r.url);else location.href=r.url}catch(e){toast(errMsg(e))}}
async function openP(id){S.sy=scrollY;S.pid=+id;S.prod=null;S.perr=null;S.img=0;S.sel={size:0,height:0};R();scrollTo(0,0);try{S.prod=await API('/api/products/'+id)}catch(e){S.perr=e}R()}
const setLang=l=>{LANG=l;LS.set('cfx.lang',l);if(TG&&TG.initData)API('/api/me',{method:'PATCH',body:{lang:l}}).catch(()=>{});R()};
async function act(a,el){const d=el.dataset,v=d.v;switch(a){
case'tab':S.tab=v;S.pid=null;S.sheet=0;if(v==='cart')await loadCart();if(v==='buys')await loadBuys();scrollTo(0,0);break;
case'f':S.f[d.k]=String(S.f[d.k])===String(v)?'':v;loadList(true);break;
case'showF':S.showF=!S.showF;break;
case'reset':{const q=S.f.q;S.f={q,category:'',audience:'',size:'',height:'',tag:'',format:'',price_min:'',price_max:'',featured:'',sort:'featured'};loadList(true);break}
case'more':S.list.page++;loadList(false);return;
case'retry':loadList(true);return;
case'boot':S.err=null;init();return;
case'open':await openP(v);return;
case'back':S.pid=null;R();scrollTo(0,S.sy||0);return;
case'img':S.img=+v;break;
case'sel':S.sel[d.k]=S.sel[d.k]==v?0:+v;break;
case'add':case'now':{const id=+v;if(owned(id)){toast(t('own'));break}if(!S.cart.some(c=>c.id===id))S.cart.push({id,size:S.sel.size||0,height:S.sel.height||0});saveCart();await loadCart();if(a==='add')toast(t('inCart'));else S.sheet=1;break}
case'rm':S.cart=S.cart.filter(c=>c.id!=v);saveCart();break;
case'clr':S.cart=[];saveCart();S.cartItems=[];break;
case'co':if(!S.cart.length){toast(t('emp'));break}S.sheet=1;break;
case'close':S.sheet=0;break;
case'pay':await pay();return;
case'get':await dl(v);return;
case'lang':{const l=B().settings.languages||['ru','kk','en'];setLang(l[(l.indexOf(LANG)+1)%l.length]);return}
case'setlang':setLang(v);return}
R()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b)});
let qt;document.addEventListener('input',e=>{if(e.target.id==='q'){S.f.q=e.target.value;clearTimeout(qt);qt=setTimeout(()=>loadList(true),300)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.p){S.f[t.dataset.p]=t.value;loadList(true)}else if(t.dataset.s){S.f[t.dataset.s]=t.value;loadList(true)}});
init();
</script></body></html>
